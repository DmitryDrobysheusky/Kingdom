<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.KM_API="https://script.google.com/macros/s/AKfycbzS2cffB5XP8uuHVLE0C34Y4Gt4Ekw_Vft7aCyfCCd8g-lU3gbOD212G0tSk9SK10HW/exec";</script>
<title>Королевская канцелярия</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=PT+Mono&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>/* Layout: sticky header + tab bar, single column of ledger sections; bottom sheet for rolls and the structure catalog */
:root{
  --bg:#ECEFE9; --surface:#F7F8F4; --surface2:#E3E7DF; --ink:#1B221E; --muted:#5B665F; --line:#CDD4CA;
  --accent:#2C5A44; --accent-ink:#F4F7F2; --brass:#94701C;
  --cul:#7A4C99; --eco:#9C6F12; --loy:#2D5C9B; --sta:#37744A;
  --good:#2A7A4C; --warn:#A8661A; --bad:#AD3528;
  --cs:#1F7A52; --su:#3F6FA8; --fa:#9A6A1E; --cf:#A33227;
  --shadow:0 8px 28px rgba(20,30,24,.18);
  --f-display:"Alegreya SC","Alegreya",Georgia,serif;
  --f-body:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201B; --surface2:#1F2923; --ink:#E3E9E3; --muted:#97A39A; --line:#2B362F;
  --accent:#7DB896; --accent-ink:#0F1612; --brass:#D1A952;
  --cul:#B994D6; --eco:#D8AE56; --loy:#80A8DF; --sta:#88C090;
  --good:#6FC48E; --warn:#E0A052; --bad:#E57366;
  --cs:#62C895; --su:#86AEE3; --fa:#D9AB5E; --cf:#EA7468;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201B; --surface2:#1F2923; --ink:#E3E9E3; --muted:#97A39A; --line:#2B362F;
  --accent:#7DB896; --accent-ink:#0F1612; --brass:#D1A952;
  --cul:#B994D6; --eco:#D8AE56; --loy:#80A8DF; --sta:#88C090;
  --good:#6FC48E; --warn:#E0A052; --bad:#E57366;
  --cs:#62C895; --su:#86AEE3; --fa:#D9AB5E; --cf:#EA7468;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.crest{flex:none;width:44px;height:50px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);font:700 20px/1 var(--f-display);padding-bottom:8px}
.crest small{display:block;font:600 8px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.title-box{min-width:0;flex:1}
.title-box h1{font-size:22px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-box .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{flex:none;font-size:11.5px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.sync.ro{color:var(--warn)}
.tabs{max-width:980px;margin:0 auto;padding:6px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 9px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 90px;display:flex;flex-direction:column;gap:18px}
.banner{padding:10px 12px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:13.5px}
.banner b{color:var(--ink)}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink)}

.ribbon{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.ribbon{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font:700 24px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.stat .h{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.alert{border-color:var(--bad)} .stat.alert .v{color:var(--bad)}
.stat.warnc .v{color:var(--warn)}
.xpbar{height:4px;border-radius:4px;background:var(--surface2);margin-top:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--brass)}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.sec-h .aside{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.inp,select.inp,textarea.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);font-size:15px}
textarea.inp{min-height:90px;resize:vertical}
.inp.n{font-family:var(--f-num);text-align:center}
.inp:disabled,select:disabled{opacity:.7}

.btn{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.step{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.step button{width:32px;border:0;background:var(--surface2);cursor:pointer;font:700 16px/1 var(--f-num);color:var(--ink)}
.step input{width:52px;border:0;background:none;text-align:center;font:700 16px/1 var(--f-num);padding:6px 0;color:var(--ink);-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}

/* abilities */
.abil{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0;border-top:4px solid var(--ab)}
.abil .nm{font:700 15px/1.1 var(--f-display);color:var(--ab)}
.abil .sc{display:flex;align-items:center;gap:8px}
.abil .mod{font:700 22px/1 var(--f-num)}
.ruin{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.ruin .rn{font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.meter{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--bad)}
.ab-culture{--ab:var(--cul)} .ab-economy{--ab:var(--eco)} .ab-loyalty{--ab:var(--loy)} .ab-stability{--ab:var(--sta)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
@media (max-width:640px){.skills{grid-template-columns:1fr}}
.sk{display:grid;grid-template-columns:8px minmax(0,1fr) 112px 48px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.sk .dot{width:8px;height:8px;border-radius:50%;background:var(--ab)}
.sk .n{min-width:0}
.sk .n b{display:block;font-weight:700;font-size:14.5px}
.sk .n span{display:block;font-size:11.5px;color:var(--muted)}
.sk select{padding:4px 6px;font-size:13px}
.sk .tot{font:700 17px/1 var(--f-num);text-align:right;cursor:pointer;background:none;border:0;color:var(--ink)}

.leaders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:700px){.leaders{grid-template-columns:1fr}}
.ld{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;background:var(--bg)}
.ld.vac{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--bg))}
.ld .role{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.ld .role em{font-style:normal;font-size:11.5px;color:var(--ab);font-weight:700}
.ld .flags{display:flex;gap:10px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.ld .flags label{display:flex;gap:4px;align-items:center;cursor:pointer}
.ld input.inp{grid-column:1/-1;padding:5px 8px;font-size:14px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.p-upkeep{color:var(--brass)} .chip.p-commerce{color:var(--eco)} .chip.p-leadership{color:var(--loy)}
.chip.p-region{color:var(--sta)} .chip.p-civic{color:var(--cul)} .chip.p-army{color:var(--bad)}
.chip.bad{color:var(--bad)} .chip.good{color:var(--good)}

.comms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:700px){.comms{grid-template-columns:repeat(2,minmax(0,1fr))}}
.comm{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--bg)}
.comm .k{font-size:12.5px;font-weight:700}
.comm .cap{font-size:11.5px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.t td.r{text-align:right}
.scroll{overflow-x:auto}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{font-weight:700}
.li .main p{margin:3px 0 0;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* actions */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.acts{grid-template-columns:1fr}}
.act{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;color:var(--ink)}
.act:hover{border-color:var(--accent)}
.act .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.act .t1 b{font-size:15px}
.act .en{font-size:11.5px;color:var(--muted)}
.act .sks{display:flex;flex-wrap:wrap;gap:4px}
.skt{font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid color-mix(in srgb,var(--ab) 45%,transparent);color:var(--ab);white-space:nowrap}
.act.used{opacity:.62}
.phase-h{font:700 16px/1.2 var(--f-display);margin-top:6px;display:flex;gap:8px;align-items:baseline}
.phase-h span{font:400 12.5px var(--f-body);color:var(--muted)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  max-width:760px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:800px){.sheet{bottom:auto;top:5%;max-height:90%;border-radius:18px}}
.sheet-h{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:21px}
.sheet-b{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.x{margin-left:auto;background:var(--surface2);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none;color:var(--ink)}
.rules{font-size:14px;line-height:1.5}
.rules p{margin:0 0 6px}
.rules ul{margin:4px 0 6px;padding-left:20px}
details.rd{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.rd summary{cursor:pointer;font-weight:700}
.oc{border-left:4px solid var(--c);padding:4px 0 4px 10px;margin-top:8px}
.oc h4{margin:0 0 3px;font-size:13px;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.c-cs{--c:var(--cs)} .c-su{--c:var(--su)} .c-fa{--c:var(--fa)} .c-cf{--c:var(--cf)}
.skpick{display:flex;flex-wrap:wrap;gap:6px}
.skb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline;color:var(--ink)}
.skb .m{font:700 15px var(--f-num)}
.skb[aria-pressed="true"]{border-color:var(--ab);box-shadow:inset 0 0 0 2px var(--ab)}
.skb.locked{opacity:.5}
.skb .nm{font-weight:700;color:var(--ab);font-size:13.5px}
.mods{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.mod{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dotted var(--line)}
.mod .v{font:700 14px var(--f-num)}
.mod.off{opacity:.45} .mod.off .v{text-decoration:line-through}
.mod .ty{font-size:11px;color:var(--muted);margin-left:4px}
.tot-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.tot-line .big{font:700 26px/1 var(--f-num)}
.result{border-radius:14px;padding:12px 14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:8px}
.result .deg{font:700 22px/1.1 var(--f-display);color:var(--c)}
.result .calc{font:14px var(--f-num);color:var(--muted)}
.fx{display:inline-flex;align-items:center;gap:4px;margin:2px 3px 2px 0;padding:2px 9px;border-radius:7px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;vertical-align:baseline}
.fx.done{opacity:.5;cursor:default;border-style:dashed}
.fx.neutral{border-color:var(--line);background:var(--surface2);cursor:default}
.d20{display:inline-grid;place-items:center;width:52px;height:52px;background:var(--ink);color:var(--bg);font:700 22px/1 var(--f-num);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.d20.n20{background:var(--cs)} .d20.n1{background:var(--cf)}

/* settlements */
.st-grid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:10px}
.block{border:2px solid var(--line);border-radius:10px;padding:5px;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);min-width:0}
.lot{min-height:54px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;line-height:1.15;padding:3px;cursor:pointer;background:none;color:var(--muted);min-width:0;overflow:hidden;word-break:break-word}
.lot.b{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--ink);font-weight:700}
.lot.res{background:color-mix(in srgb,var(--brass) 16%,var(--surface))}
.lot.w2{grid-column:span 2}
.lot.w4{grid-column:span 2;grid-row:span 2}
.lot.rub{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,transparent 6px 12px);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.cat-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.cat-item .hd{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.cat-item ul{margin:0;padding-left:18px;font-size:13px}
.cost{font:12.5px var(--f-num);color:var(--muted)}

.log{display:flex;flex-direction:column;font-size:13.5px}
.log .e{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.log .e time{font:12px var(--f-num);color:var(--muted);white-space:nowrap}
.turnstep{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.turnstep:last-child{border-bottom:0}
.turnstep .no{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 13px var(--f-num)}
.turnstep.done .no{background:var(--accent);color:var(--accent-ink)}
.turnstep h3{font:700 15px var(--f-body);margin:3px 0 4px}
.turnstep p{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.ro-hide{}
body.readonly .ro-hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}

.step.sm button{width:26px;font-size:14px}.step.sm input{width:34px;font-size:14px;padding:4px 0}
table.t td:first-child{min-width:0}

.fbtn.abf{color:var(--ab);border-color:color-mix(in srgb,var(--ab) 40%,var(--line))}
.fbtn.abf[aria-pressed="true"]{background:var(--ab);color:var(--bg);border-color:var(--ab)}
.fbtn .mono{font-size:12px;opacity:.85}
.skt b{font-weight:700}

.ab-h{display:flex;align-items:baseline;gap:8px;padding:2px 0 2px 10px;border-left:4px solid var(--ab);margin-top:2px}
.ab-h b{font:700 15px/1.2 var(--f-display);color:var(--ab)}
.ab-h .mono{font-size:13px;color:var(--ab)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="crest" id="crest" aria-label="Уровень королевства"></div>
    <div class="title-box"><h1 id="kname">Королевство</h1><div class="sub" id="ksub"></div></div>
    <span class="sync" id="sync">…</span>
  </div>

<script>window.KM_DATA={"activities":[{"id":"abandon-hex","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","skills":{"exploration":0,"wilderness":0},"defaultToBestSkill":true,"title":"Abandon Hex","description":"<p>After careful consideration, you decide that you would rather not hold onto a particular hex as part of your claimed territory. You renounce your claim to it and pull back any settlers or explorers. Attempt a basic Exploration or Wilderness check. You can abandon more than one hex at a time, but each additional hex you abandon increases the DC of this check by 1.<\/p>","requirement":"The hex to be abandoned must be controlled.","criticalSuccess":{"msg":"<p>You abandon the hex or hexes, decreasing your kingdom's Size by 1 per hex abandoned. Settlers and explorers return and resettle elsewhere in your kingdom, bringing with them bits of salvage from the abandoned hexes. @gainMultiple1ResourcePoints per abandoned hex.<\/p>"},"success":{"msg":"<p>You abandon the hex or hexes, decreasing your kingdom's Size by 1 per hex abandoned. Settlers and explorers return and resettle elsewhere in your kingdom, bringing with them bits of salvage from the abandoned hexes. @gain1Unrest<\/p>"},"failure":{"msg":"<p>You abandon the hex or hexes, decreasing your kingdom's Size by 1 per hex abandoned. Some citizens become disgruntled refugees who refuse to leave the hex. @gain2Unrest and then attempt a @Check[type:flat|dc:6]. If you fail, the refugees become bandits, and during your next Event phase, @gain1SquattersEvent in addition to any other event that might occur.<\/p>"},"criticalFailure":{"msg":"<p>You abandon the hex or hexes, decreasing your kingdom's Size by 1 per hex abandoned. Some citizens become disgruntled refugees who refuse to leave the hex. @gain3Unrest and automatically @gain1BanditActivityEvent.<\/p>"},"special":"The Unrest gained from abandoning a hex doubles if it includes a settlement. A settlement in an abandoned hex becomes a Freehold."},{"id":"build-roads","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","skills":{"engineering":0},"title":"Build Roads","description":"<p>You order your kingdom’s engineers to construct a network of robust roads through the hex. Travel along roads uses a terrain type one step better than the surrounding terrain; for example, roads through forest hexes—normally difficult terrain—allow travel as if it were open terrain.<\/p><p>Spend RP as determined by the hex’s most inhospitable terrain (if the hex includes any rivers that cross the hex from one hex side to any other, you must spend double the normal RP cost to also build bridges; this adds the Bridge structure to that hex):<\/p><ul><li><b>Mountains<\/b>: @lose12ResourcePoints<\/li><li><b>Swamps<\/b>: @lose8ResourcePoints<\/li><li><b>Forests<\/b>: @lose4ResourcePoints<\/li><li><b>Hills<\/b>: @lose2ResourcePoints<\/li><li><b>Plains<\/b>: @lose1ResourcePoints<\/li><\/ul><p>Then attempt a basic check. Work with the GM to determine where your roads appear on the map.<\/p>","requirement":"The hex in which you seek to build roads must be claimed by your kingdom.","criticalSuccess":{"msg":"<p>You build roads into the target hex and, if possible, one adjacent claimed hex that doesn’t yet have roads and whose terrain features are at least as hospitable as those of the target hex<\/p>"},"success":{"msg":"<p>You build roads in the hex.<\/p>"},"failure":{"msg":"<p>You fail to build roads in the hex.<\/p>"},"criticalFailure":{"msg":"<p>Your attempt to build roads ends in disaster. Not only do you fail to build roads, but you lose several workers to an accident, banditry, a vicious monster, or some other unforeseen occurrence. @gain1Unrest<\/p>"}},{"id":"build-structure","oncePerRound":false,"fortune":false,"enabled":true,"phase":"civic","dc":"custom","title":"Build Structure","description":"<p>You attempt to build a structure in the settlement that’s granting the Civic activity. You may choose any structure for which you meet the requirements. Select the appropriate number of contiguous buildable lots in a single block as specified by the structure’s entry and spend the specified RP and Commodity cost. Then attempt the structure’s skill check.<\/p><p>You can also use this activity to attempt to repair a structure that was damaged as the result of an event but hasn’t been replaced by Rubble. To do this, first spend half the structure’s listed RP and Commodity cost, and then attempt the specified check. The existing structure gives you a +2 item bonus to the check.<\/p><p>On a success, record the new construction on the Urban Grid. Unless the structure’s entry states otherwise, its effects are immediate; if the structure adjusts a Ruin’s point total, adjust it upon construction.<\/p>","skills":{"agriculture":0,"arts":0,"boating":0,"defense":0,"engineering":0,"exploration":0,"folklore":0,"industry":0,"intrigue":0,"magic":0,"politics":0,"scholarship":0,"statecraft":0,"trade":0,"warfare":0,"wilderness":0},"criticalSuccess":{"msg":"<p>You construct or repair the structure with great efficiency and get back half of the Commodities spent in construction or repair.<\/p>"},"success":{"msg":"<p>You construct or repair the structure.<\/p>"},"failure":{"msg":"<p>You fail to construct or repair the structure. You can try to complete it next Kingdom turn; if you do so, you do not need to re-pay the RP and Commodity cost.<\/p>"},"criticalFailure":{"msg":"<p>You fail to construct the structure; if you were attempting to repair a damaged structure, it is reduced to Rubble. In either event, Rubble now fills the structure’s lots, which must be cleared with the Demolish activity before you can attempt to Build a Structure in them again.<\/p>"}},{"id":"capital-investment","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Capital Investment","description":"<p>You contribute funds from your personal wealth for the good of the kingdom, including coinage, gems, jewelry, weapons and armor salvaged from enemies, magical or alchemical items, and so on. Your contribution generates economic activity in the form of RP that can be used during your current Kingdom turn or on the next Kingdom turn (your choice).You can use Capital Investment to repay funds from Tap Treasury. In this case, no roll is needed and you simply deduct the appropriate amount of funds from your personal wealth to pay back that which was borrowed. When you use Capital Investment to generate RP, the amount of gp required to make an investment is set by your kingdom’s level. Investments below this amount cause your attempt at Capital Investment to suffer an automatic critical failure, while investments above this amount are lost. The investment required is equal to the value listed on Table 10–9: Party Treasure by Level @UUID[Compendium.pf2e.journals.JournalEntry.S55aqwWIzpQRFhcq.JournalEntryPage.Dae8LHdXZuBv06Jk]{Treasure}; use the value for your kingdom’s level under the “Currency per Additional PC” as the required investment value. This is a basic check.<\/p>","requirement":"You must be within the influence of a settlement that contains at least one Bank.","skills":{"trade":0},"criticalSuccess":{"msg":"<p>Success Your kingdom reaps the benefits of your investment. @gain4RolledResourceDice<\/p>"},"success":{"msg":"<p>Your investment helps the economy. @gain2RolledResourceDice<\/p>"},"failure":{"msg":"<p>Your investment ends up being used to shore up shortfalls elsewhere. @gain1d4ResourcePoints<\/p>"},"criticalFailure":{"msg":"<p>Your investment is embezzled, lost, or otherwise misappropriated. Choose one of the following: either @gain1RolledResourceDice and also increase your Crime by an equal amount, or gain 0 RP and @gain1Crime<\/p>"}},{"id":"celebrate-holiday","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Celebrate Holiday","description":"<p>You declare a day of celebration. Holidays may be religious, historical, martial, or simply festive, but all relieve your citizens from their labors and give them a chance to make merry at the kingdom’s expense. Attempt a basic check, but if your kingdom Celebrated a Holiday the previous turn, the DC increases by 4, as your kingdom hasn’t had a chance to recover from the previous gala.<\/p>","skills":{"folklore":0},"criticalSuccess":{"msg":"<p>Your holidays are a delight to your people. The event is expensive, but incidental income from the celebrants covers the cost. You gain a +2 circumstance bonus to Loyalty-based checks until the end of your next Kingdom turn.<\/p>","modifiers":[{"turns":2,"buttonLabel":"+2 Circumstance to Loyalty","name":"Celebrate Holiday: Critical Success","enabled":true,"applyIf":[{"eq":["@ability","loyalty"]}],"value":2,"type":"circumstance"},{"name":"Celebrated Holiday on the Previous Turn","buttonLabel":"+4 DC Increase if Celebrate Holiday on the Next Turn","type":"untyped","turns":2,"enabled":true,"value":-4,"applyIf":[{"in":["@activity",["celebrate-holiday","celebrate-holiday-vk"]]}]}]},"success":{"msg":"<p>Your holidays are a success, but they’re also expensive. You gain a +1 circumstance bonus to Loyalty-based checks until the end of your next Kingdom turn. @lose1RolledResourceDice. If you can’t afford this cost, treat this result as a Critical Failure instead.<\/p>","modifiers":[{"turns":2,"enabled":true,"buttonLabel":"+1 Circumstance to Loyalty","name":"Celebrate Holiday: Success","applyIf":[{"eq":["@ability","loyalty"]}],"value":1,"type":"circumstance"},{"name":"Celebrated Holiday on the Previous Turn","buttonLabel":"+4 DC Increase if Celebrate Holiday on the Next Turn","type":"untyped","turns":2,"enabled":true,"value":-4,"applyIf":[{"in":["@activity",["celebrate-holiday","celebrate-holiday-vk"]]}]}]},"failure":{"msg":"<p>The holiday passes with little enthusiasm, but is still expensive. @lose1RolledResourceDice. If you can’t afford this cost, treat this result as a Critical Failure instead.<\/p>","modifiers":[{"name":"Celebrated Holiday on the Previous Turn","buttonLabel":"+4 DC Increase if Celebrate Holiday on the Next Turn","type":"untyped","turns":2,"enabled":true,"value":-4,"applyIf":[{"in":["@activity",["celebrate-holiday","celebrate-holiday-vk"]]}]}]},"criticalFailure":{"msg":"<p>Your festival days are poorly organized, and the citizens actively mock your failed attempt to celebrate. @lose4ResourceDiceNextTurn. The failure also causes you to take a –1 circumstance penalty to Loyalty-based checks until the end of the next Kingdom turn.<\/p>","modifiers":[{"turns":2,"enabled":true,"buttonLabel":"-1 Circumstance to Loyalty","name":"Celebrate Holiday: Critical Failure","applyIf":[{"eq":["@ability","loyalty"]}],"value":-1,"type":"circumstance"},{"name":"Celebrated Holiday on the Previous Turn","buttonLabel":"+4 DC Increase if Celebrate Holiday on the Next Turn","type":"untyped","turns":2,"enabled":true,"value":-4,"applyIf":[{"in":["@activity",["celebrate-holiday","celebrate-holiday-vk"]]}]}]}},{"id":"claim-hex","title":"Claim Hex","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","requirement":"You have Reconnoitered the hex to be claimed during hexploration. This hex must be adjacent to at least one hex that’s already part of your kingdom. If the hex to be claimed contains dangerous hazards or monsters, they must first be cleared out—either via standard adventuring or the Clear Hex activity.","description":"<p>Your surveyors fully explore the hex and attempt to add it into your kingdom’s domain. @lose1ResourcePoints and then attempt a basic Exploration, Intrigue, Magic, or Wilderness check.<\/p>","defaultToBestSkill":true,"skills":{"exploration":0,"intrigue":0,"magic":0,"wilderness":0},"criticalSuccess":{"msg":"<p>You claim the hex and immediately add it to your territory, increasing your kingdom's Size by 1. Your occupation of the hex goes so smoothly that you can immediately attempt another Region activity.<\/p>"},"success":{"msg":"<p>You claim the hex and add it to your territory, increasing your kingdom's Size by 1.<\/p>"},"failure":{"msg":"<p>You fail to claim the hex.<\/p>"},"criticalFailure":{"msg":"<p>You fail to claim the hex, and a number of early settlers and explorers are lost, causing you to take a –1 circumstance penalty to Stability-based checks until the end of your next Kingdom turn.<\/p>","modifiers":[{"turns":2,"enabled":true,"buttonLabel":"-1 Circumstance to Stability","name":"Claim Hex: Critical Failure","applyIf":[{"eq":["@ability","stability"]}],"value":-1,"type":"circumstance"}]},"special":"At 1st level, when selecting the three activities you take during the Region Activities step of the Activity phase of the Kingdom turn, you may select this activity no more than once. Once your kingdom reaches 4th level, you may select it up to twice per turn, and after reaching 9th level you may select it up to three times per turn. When you successfully claim a hex, gain kingdom XP. Many hexes have terrain features that grant benefits to your kingdom when claimed"},{"id":"clandestine-business","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Clandestine Business","automationNotes":"activities.clandestine-business.automationNotes","description":"<p>You know there are criminals in your kingdom, and they know you know. You encourage them to send kickbacks in the form of resources and Commodities to the government, but the common citizens will be more than upset if they find out! This starts as a basic check against your Control DC, but every subsequent Kingdom turn you pursue Clandestine Business, the DC increases by 2. Every Kingdom turn that passes without Clandestine Business reduces the DC by 1 (until you reach your Control DC).<\/p>","skills":{"intrigue":1},"criticalSuccess":{"msg":"<p>@gain2RolledResourceDice. In addition, you @gain1d4Luxuries. The public is none the wiser.<\/p>"},"success":{"msg":"<p>Either @gain2RolledResourceDice, or gain @gain1d4Luxuries. Regardless of your choice, rumors spread about where the government is getting these “gifts.” @gain1Unrest.<\/p>"},"failure":{"msg":"<p>@gain1RolledResourceDice. Rumors are backed up with eyewitness accounts. @gain1Unrest and @gain1Corruption.<\/p>"},"criticalFailure":{"msg":"<p>You gain nothing from the Clandestine Business but angry citizens. @gain1d6Unrest, @gain2Corruption, and one other Ruin of your choice by 1<\/p> <ul><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"clear-hex","oncePerRound":false,"fortune":false,"enabled":true,"title":"Clear Hex","phase":"region","dc":"custom","modifiers":[{"name":"Hex is not part of your kingdom","buttonLabel":"+2 DC increase if not part of your kingdom","type":"untyped","enabled":false,"value":-2}],"description":"<p>Engineers and mercenaries attempt to prepare a hex to serve as the site for a settlement, or they work to remove an existing improvement, a dangerous hazard, or an encounter.<\/p> <p>If you’re trying to prepare a hex for a settlement or demolish an improvement you previously built (or that was already present in the hex), spend RP as determined by the hex’s most inhospitable terrain feature:<\/p> <ul> <li><b>Mountains<\/b>: @lose12ResourcePoints<\/li> <li><b>Swamps<\/b>: @lose8ResourcePoints<\/li> <li><b>Forests<\/b>: @lose4ResourcePoints<\/li> <li><b>Hills<\/b>: @lose2ResourcePoints<\/li> <li><b>Plains<\/b>: @lose1ResourcePoints<\/li> <\/ul> <p>Then attempt a basic Engineering check. If you’re trying to remove a hazard or encounter, instead attempt an Exploration check. The DC of this check is set by the highest level creature or hazard in the hex (as set by Table 10–5: DCs by Level, on page 503 of the Pathfinder Core Rulebook).<\/p><p>If the hex you’re attempting to Clear has existing Ruins or an existing Structure, your action doesn’t physically remove the buildings from the area and you can later incorporate these buildings (or repair ruined ones) into a Settlement you build here later. Regardless of the skill used, increase the basic DC by 2 if the hex to be cleared is not yet part of your kingdom.<\/p>","skills":{"engineering":0,"exploration":0},"criticalSuccess":{"msg":"<p>You successfully clear the hex. If you spent RP to attempt this activity, you’re refunded half of the RP cost. If you were removing dangerous creatures (but not hazards) from the hex, your explorers and mercenaries recover 2 Luxury Commodities as treasure. @gain2Luxuries<\/p>"},"success":{"msg":"<p>You successfully clear the hex.<\/p>"},"failure":{"msg":"<p>You fail to clear the hex.<\/p>"},"criticalFailure":{"msg":"<p>You catastrophically fail to clear the hex and several workers lose their lives. @gain1Unrest<\/p>"}},{"order":1,"id":"collect-taxes","oncePerRound":false,"fortune":false,"enabled":true,"phase":"commerce","dc":"control","title":"Collect Taxes","description":"<p>Tax collectors travel through the lands to collect funds for the betterment of the kingdom. Attempt a basic check. If you don’t attempt to Collect Taxes, you can instead attempt a @Check[dc:11|type:flat]; on a success, @lose1Unrest.<\/p>","skills":{"trade":1},"criticalSuccess":{"msg":"<p>Your tax collectors are wildly successful! For the remainder of the Kingdom turn, gain a +2 circumstance bonus to Economy-based checks.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+2 Circumstance to Economy","name":"Collect Taxes: Critical Success","enabled":true,"applyIf":[{"eq":["@ability","economy"]}],"value":2,"type":"circumstance"}]},"success":{"msg":"<p>Your tax collectors gather enough to grant you a +1 circumstance bonus to Economy-based checks for the remainder of the Kingdom turn. If you attempted to Collect Taxes during the previous turn, @gain1Unrest<\/p>","modifiers":[{"buttonLabel":"+1 Circumstance to Economy","name":"Collect Taxes: Success","turns":1,"enabled":true,"applyIf":[{"eq":["@ability","economy"]}],"value":1,"type":"circumstance"}]},"failure":{"msg":"<p>Your tax collectors gather enough to grant you a +1 circumstance bonus to Economy-based checks for the remainder of the Kingdom turn. In addition, people are unhappy about taxes—@gain1Unrest (or @gain2Unrest if you attempted to Collect Taxes the previous turn).<\/p>","modifiers":[{"turns":1,"enabled":true,"buttonLabel":"+1 Circumstance to Economy","name":"Collect Taxes: Failure","applyIf":[{"eq":["@ability","economy"]}],"value":1,"type":"circumstance"}]},"criticalFailure":{"msg":"<p>Your tax collectors encounter resistance from the citizens and their attempts to gather taxes are rebuffed. While the tax collectors still manage to gather enough taxes to support essential government, they have angered the kingdom's citizens and encouraged rebellious acts. @gain2Unrest, and choose one Ruin to increase by 1<\/p> <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"craft-luxuries","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Craft Luxuries","description":"<p>You encourage your artisans to craft luxury goods and may even aid them in this pursuit. @lose1RolledResourceDice. Then attempt a basic check.<\/p>","skills":{"arts":0},"criticalSuccess":{"msg":"<p>Your artisans exceed expectations and craft extravagant goods. @gain1d4Luxuries<\/p>"},"success":{"msg":"<p>Your artisans produce some delightful goods. @gain1Luxuries<\/p>"},"failure":{"msg":"<p>Your artisans fail to produce anything noteworthy.<\/p>"},"criticalFailure":{"msg":"<p>Your artisans not only fail to produce anything noteworthy, but some took advantage of the opportunity to push their own agendas or earn more for themselves by selling to underground markets. Increase one of your Ruins by 1: <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul><\/p>"}},{"id":"create-a-masterpiece","oncePerRound":true,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Create a Masterpiece","description":"<p>You encourage your kingdom’s artists to create and display a masterful work of art to bolster your kingdom’s reputation. Attempt a basic check; the result affects either Fame or Infamy (depending on the type of kingdom you’re running). Create a Masterpiece may be attempted only once per Kingdom turn regardless of the number of leaders pursuing activities.<\/p>","skills":{"arts":1},"criticalSuccess":{"msg":"<p>@gain1Fame, and @gain1FameNextTurn. @gain2RolledResourceDice<\/p>"},"success":{"msg":"<p>@gain1Fame<\/p>"},"failure":{"msg":"<p>Your attempt to create a masterpiece fails.<\/p>"},"criticalFailure":{"msg":"<p>Not only does your attempt to create a masterpiece fail, it does so in a dramatic and humiliating way. @lose1Fame; if you have no Fame or Infamy points to lose, instead @gain1d4Unrest<\/p>"}},{"id":"creative-solution","enabled":true,"oncePerRound":false,"fortune":true,"phase":"leadership","dc":"control","title":"Creative Solution","description":"<p>You work with your kingdom’s scholars, thinkers, and practitioners of magical and mundane experimentation to come up with new ways to resolve issues when business as usual is just not working. Attempt a basic check. (Clarification: This was clarified to act as a reroll with +2 Circumstance Bonus and Fortune. The PCs might know the degree of success before they attempt the reroll, but the GM must not tell them the consequence of that degree before they reroll. This will mostly come up when handling kingdom events)<\/p>","skills":{"scholarship":0},"criticalSuccess":{"msg":"<p>You can call upon the solution to aid in resolving any Kingdom skill check made during the remainder of this Kingdom turn @gain1CreativeSolution. Do so when a Kingdom skill check is rolled, but before you learn the result. Immediately reroll that check with a +2 circumstance bonus; you must take the new result. If you don’t use your Creative Solution by the end of this turn, you lose this benefit and gain 10XP instead.<\/p>"},"success":{"msg":"<p>You can call upon the solution to aid in resolving any Kingdom skill check made during the remainder of this Kingdom turn @gain1CreativeSolution. Do so when a Kingdom skill check is rolled, but before you learn the result. Immediately reroll that check with a +2 circumstance bonus; you must take the new result. If you don’t use your Creative Solution by the end of this turn, you lose this benefit and gain 10XP instead. In addition, @lose1d4ResourcePoints to research the solution. This cost is paid now, whether or not you use your Creative Solution.<\/p>"},"failure":{"msg":"<p>Your attempt at researching is a failure and you @lose2d6ResourcePoints. It provides no advantage.<\/p>"},"criticalFailure":{"msg":"<p>Your attempt at researching is a failure and you @lose2d6ResourcePoints. It provides no advantage. In addition, your scholars and thinkers are so frustrated that you take a –1 circumstance penalty to Culture-based checks until the end of the next Kingdom turn.<\/p>","modifiers":[{"turns":2,"enabled":true,"value":-1,"buttonLabel":"-1 Circumstance to Culture","name":"Creative Solution: Critical Failure","type":"circumstance","applyIf":[{"eq":["@ability","culture"]}]}]},"special":"You cannot influence a check with Supernatural Solution and Creative Solution simultaneously."},{"id":"decadent-feasts","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Decadent Feasts","automationNotes":"activities.decadent-feasts.automationNotes","description":"<p>Your goddess is more than just the goddess of undeath— she’s also the goddess of gluttony. And you are no fool; you understand the fear your goddess inspires in the living and knows that focusing on other aspects of her worship are more likely to result in positive growth for the nation. In order to distract the populace, you arrange for decadent feasts for the people, simultaneously feeding the hungry while camouflaging some of your faith’s more sinister aspects. @lose1d8Food and @lose1Luxuries, then attempt a basic Agriculture or Trade check to determine how effective the feasts are.<\/p>","skills":{"agriculture":0},"criticalSuccess":{"msg":"<p>The people rejoice and glut themselves on the repast! @lose1d6Unrest, and the next time this Kingdom turn you suffer an effect that increases Unrest, do not increase your Unrest.<\/p>"},"success":{"msg":"<p>The people enjoy the meal, but no longer than it takes to gulp it down. @lose1d3Unrest<\/p>"},"failure":{"msg":"<p>The meal is appreciated, but the people remain suspicious. @lose1Unrest.<\/p>"},"criticalFailure":{"msg":"<p>The people are too suspicious of the feast to enjoy it. Worse, rumors that Jaethal is trying to distract the citizens from an evil ritual spread. @gain1d4Unrest and @gain1Corruption<\/p>"}},{"id":"deliberate-planning","oncePerRound":false,"fortune":true,"enabled":false,"phase":"leadership","dc":"event","title":"Deliberate Planning","description":"<p>You take time and weigh all options when faced with decisions, regardless of their importance. While this can sometimes lead you to taking too long to make choices, your theoretical analysis can be quite helpful in navigating continuous events. Choose a single continuous event that will affect your kingdom on this turn’s Event Phase, then attempt a Scholarship check against that event’s DC.<\/p>","skills":{"scholarship":0},"criticalSuccess":{"msg":"<p>Your aid has been monumentally helpful. When you roll to resolve the continuous event you chose, you can roll twice and choose which result to apply. You gain a +1 circumstance bonus to each roll. This is a Fortune effect.<\/p>","modifiers":[{"turns":1,"enabled":false,"value":1,"isConsumedAfterRoll":true,"buttonLabel":"+1 Circumstance to Resolve Continuous Event","name":"Deliberate Planning: Critical Success","type":"circumstance","fortune":true,"applyIf":[{"in":["continuous","@eventTraits"]}]}]},"success":{"msg":"<p>Your suggestions are useful, granting you a +1 circumstance bonus to rolls to resolve the chosen continuous event.<\/p>","modifiers":[{"turns":1,"enabled":false,"value":1,"isConsumedAfterRoll":true,"buttonLabel":"+1 Circumstance to Resolve Continuous Event","name":"Deliberate Planning: Success","type":"circumstance","applyIf":[{"in":["continuous","@eventTraits"]}]}]},"failure":{"msg":"<p>Your advice isn’t helpful, but neither does it hinder your ability to handle the event.<\/p>"},"criticalFailure":{"msg":"<p>You got too caught up in your theoretical analysis and spent too much time preparing. When you roll to resolve the continuous event you tried to plan for, roll twice and take the worse result.<\/p>","modifiers":[{"turns":1,"enabled":false,"value":0,"buttonLabel":"Roll Twice and Take the Worse Result When Resolving Continuous Event","name":"Resolving Deliberately Planned for Event: Critical Failure","type":"untyped","isConsumedAfterRoll":true,"rollTwiceKeepLowest":true,"applyIf":[{"in":["continuous","@eventTraits"]}]}]}},{"id":"demolish","oncePerRound":false,"fortune":false,"enabled":true,"phase":"civic","dc":"control","title":"Demolish","description":"<p>Choose a single occupied lot in one of your settlements and attempt a basic check to reduce it to Rubble and then clear the Rubble away to make ready for a new structure. For multiple-lot structures, you’ll need to perform multiple Demolish activities (or critically succeed at the activity) to fully clear all of the lots. As soon as you begin Demolishing a multiple-lot structure, all of the lots occupied by that structure no longer function.<\/p>","skills":{"engineering":0},"criticalSuccess":{"msg":"<p>Choose one of the following effects: you demolish an entire multiple-lot structure all at once and clear all of the lots it occupied, or you recover [[/r 1d6#Commodities]] Commodities (chosen from lumber, stone, and ore) from the Rubble of a single-lot demolition.<\/p>"},"success":{"msg":"<p>You demolish the lot successfully.<\/p>"},"failure":{"msg":"<p>You fail to demolish the lot. It remains in Rubble and cannot be used for further construction until you successfully Demolish it.<\/p>"},"criticalFailure":{"msg":"<p>You fail to demolish the lot. It remains in Rubble and cannot be used for further construction until you successfully Demolish it. In addition, accidents during the demolition cost you the lives of some of your workers. @gain1Unrest<\/p>"}},{"id":"deploy-army","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Deploy Army","automationNotes":"activities.deploy-army.automationNotes","description":"<p>The army moves through your kingdom or beyond. Since this travel occurs over the course of the entire month that preceded the Kingdom turn, the ground an army covers when it deploys can be quite extensive. You can Deploy an Army with an Exploration, Boating, or Magic check. When you use an Exploration check, choose a location within 20 hexes of the army’s current hex. If the army’s starting point and ending point are connected by a road, increase the result one degree of success. Count roadless hexes that contain swamps or mountains, or each hex where you must cross a river or lake without the aid of a bridge, as two hexes. You can issue orders to force march. Doing so grants a +4 circumstance bonus on the check, but causes the army to increase its weary condition by 1 (or by 2, if you fail the check). When you use a Boating check, the army’s starting point and ending point must be connected by a body of water; choose any location within 20 hexes along this route. You must be at least master in Magic to attempt a Magic check. When you do so, choose any location within 30 hexes of the army’s current hex, then roll your check. If the army’s deployment causes it to cross your kingdom’s border, the DC increases by 5. If the army’s deployment causes it to cross an enemy kingdom’s border, the DC instead increases by 10.<\/p>","modifiers":[{"enabled":false,"value":0,"upgradeResults":[{"upgrade":"criticalFailure"},{"upgrade":"failure"},{"upgrade":"success"}],"buttonLabel":"Starting and End Point connected by a Road","name":"Starting and End Point connected by a Road","type":"untyped","applyIf":[{"eq":["@skill","exploration"]}]},{"enabled":false,"value":4,"buttonLabel":"+4 circumstance to Force a March","name":"Force a March","type":"circumstance","applyIf":[{"eq":["@skill","exploration"]}]},{"enabled":false,"value":-5,"buttonLabel":"+5 DC Increase if Deploying across your border","name":"Deploying across your border","type":"untyped","applyIf":[{"eq":["@skill","magic"]}]},{"enabled":false,"value":-10,"buttonLabel":"+10 DC Increase if Deploying into enemy territory","name":"Deploying into enemy territory","type":"untyped","applyIf":[{"eq":["@skill","magic"]}]}],"skills":{"exploration":0,"boating":0,"magic":3},"criticalSuccess":{"msg":"<p>The army arrives much more quickly than you anticipated; it arrives at its destination and then becomes efficient.<\/p>"},"success":{"msg":"<p>The army arrives at its destination. <\/p>"},"failure":{"msg":"<p>The army arrives at its destination, but ran into some sort of trouble along the way. Increase the army’s weary condition by 1 and attempt a @Check[type:flat|dc:6]; on a failure, reduce the army’s HP by 1.<\/p>"},"criticalFailure":{"msg":"<p>Rather than arriving at its destination, the army becomes lost until it recovers from this condition. @gain1d4Unrest, and attempt a @Check[type:flat|dc:11]; on a failure, reduce the army’s HP by 1.<\/p>"}},{"id":"disband-army","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"none","title":"Disband Army","description":"<p>You can choose to disband an army with no check needed. If the army consisted of conscripts from your kingdom, the soldiers revert to being citizens. If the army was recruited from creatures encountered in the wilds, they return to their homes. A disbanded army no longer contributes to your kingdom’s Consumption.<\/p>","skills":{}},{"id":"establish-farmland","title":"Establish Farmland","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>You plant crops and establish livestock in permanent farms, ranches, and other growing operations to create Farmland. If you’re attempting to Establish Farmland in a hex that is predominantly plains, you must @lose1ResourcePoints and the check is against your Control DC. If you’re targeting a hex that is predominantly hills, you must spend @lose2ResourcePoints and the check is against your Control DC + 5.<\/p>","requirement":"Plains or hills are the predominant terrain feature in the hex; the hex is in the influence of one of your settlements.","skills":{"agriculture":0},"modifiers":[{"enabled":false,"value":-5,"buttonLabel":"+5 DC Increase if predominantly hills","name":"Predominantly Hills","type":"untyped"}],"criticalSuccess":{"msg":"<p>You establish two adjacent Farmland hexes instead of one. If your target hex was a hills hex, the additional hex may be a hills hex or a plains hex; otherwise, the additional hex must be a plains hex. If no appropriate hex is available, treat this result as a regular success instead.<\/p>"},"success":{"msg":"<p>You establish one Farmland hex.<\/p>"},"failure":{"msg":"<p>You fail to establish a Farmland hex.<\/p>"},"criticalFailure":{"msg":"<p>You fail to establish a Farmland hex, and your attempt potentially causes the spread of a blight. At the start of each of the next two Event phases, attempt a @Check[type:flat|dc:6|showDC:all]; on a failure, @gain1CropFailureEvent in this and all adjacent hexes.<\/p>"}},{"id":"establish-settlement","title":"Establish Settlement","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>You draw up plans, gather resources, entice citizens, and establish boundaries to found a brand new settlement in the hex. Attempt a basic Engineering, Industry, Politics, or Scholarship check. If you cannot pay the RP required by the result of this check, treat your result as a critical failure. A settlement always starts as a village.<\/p>","requirement":"The hex in which you’re establishing the settlement has been Cleared and doesn’t currently have a settlement (including a Freehold) in it.","defaultToBestSkill":true,"skills":{"engineering":0,"industry":0,"politics":0,"scholarship":0},"criticalSuccess":{"msg":"<p>You establish the settlement largely with the aid of enthusiastic volunteers. @lose1d6ResourcePoints<\/p>"},"success":{"msg":"<p>You establish the settlement. @lose3d6ResourcePoints<\/p>"},"failure":{"msg":"<p>You establish the settlement, but inefficiently and at great expense. @lose6d6ResourcePoints<\/p>"},"criticalFailure":{"msg":"<p>You fail to establish the settlement.<\/p>"}},{"id":"establish-trade-agreement","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"negotiationOrControl","title":"Establish Trade Agreement","description":"<p>You send a band of merchants out to establish a trade agreement between your kingdom and a group with whom you’ve established diplomatic relations. If a navigable river connects your kingdom with the other group’s territory, you can attempt a Boating check to Establish the Trade Agreement. If your kingdom’s proficiency rank in Magic is Master or higher, you can attempt a Magic check. Otherwise, attempt a Trade check.The check’s DC is either the group’s Negotiation DC (see sidebar) or your kingdom’s Control DC, whichever is higher.<\/p>","requirement":"You have diplomatic relations with the group you wish to establish an agreement with.","defaultToBestSkill":true,"skills":{"boating":0,"trade":0,"magic":3},"criticalSuccess":{"msg":"<p>You successfully establish a trade agreement with your target, and your merchants return with gifts! @gain2RolledResourceDice<\/p>"},"success":{"msg":"<p>You successfully establish a trade agreement.<\/p>"},"failure":{"msg":"<p>Your traders reach their destination but need to sweeten the deal to secure the trade agreement. @lose2RolledResourceDice. If you do so, you successfully establish a trade agreement, otherwise the attempt fails.<\/p>"},"criticalFailure":{"msg":"<p>Your trade agreement is a total loss and your traders do not return. @gain1Unrest, and until the end of the next Kingdom turn, take a –1 circumstance penalty to all Economy-related checks.<\/p>","modifiers":[{"turns":2,"enabled":false,"value":-1,"buttonLabel":"-1 Circumstance to Economy","name":"Establish Trade Agreement: Critical Failure","type":"circumstance","applyIf":[{"eq":["@ability","economy"]}]}]}},{"id":"establish-work-site-lumber","title":"Establish Work Site: Lumber Camp","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>Your hire a crew of workers to travel to a hex that contains Lumber, Ore, or Stone to be harvested. Spend RP as determined by the hex’s most inhospitable terrain:<\/p> <ul> <li><b>Mountains<\/b>: @lose12ResourcePoints<\/li> <li><b>Swamps<\/b>: @lose8ResourcePoints<\/li> <li><b>Forests<\/b>: @lose4ResourcePoints<\/li> <li><b>Hills<\/b>: @lose2ResourcePoints<\/li> <li><b>Plains<\/b>: @lose1ResourcePoints<\/li> <\/ul> <p>Then attempt a basic check. Lumber camps can be established in any hex that contains a significant amount of forest terrain. Mines and quarries can be established in any hex that contains a significant amount of hill or mountain terrain.<\/p>","skills":{"engineering":0},"criticalSuccess":{"msg":"<p>You establish a Work Site in the hex and proceed to discover an unexpectedly rich supply of high quality Commodities. All Commodity yields granted by this site are doubled until the end of the next Kingdom turn.<\/p>","modifiers":[{"name":"Double Lumber Camp Yields Next Turn","buttonLabel":"Double Lumber Camp Yields Next Turn","value":1,"type":"untyped","turns":1,"selector":"lumber","enabled":true}]},"success":{"msg":"<p>You establish a Work Site in the hex.<\/p>"},"failure":{"msg":"<p>You fail to establish a Work Site in the hex.<\/p>"},"criticalFailure":{"msg":"<p>Not only do you fail to establish a Work Site, but you lose several workers to an accident, banditry, a vicious monster, or some other unforeseen occurrence. @gain1Unrest<\/p>"}},{"id":"establish-work-site-mine","title":"Establish Work Site: Mine","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>Your hire a crew of workers to travel to a hex that contains Lumber, Ore, or Stone to be harvested. Spend RP as determined by the hex’s most inhospitable terrain:<\/p> <ul> <li><b>Mountains<\/b>: @lose12ResourcePoints<\/li> <li><b>Swamps<\/b>: @lose8ResourcePoints<\/li> <li><b>Forests<\/b>: @lose4ResourcePoints<\/li> <li><b>Hills<\/b>: @lose2ResourcePoints<\/li> <li><b>Plains<\/b>: @lose1ResourcePoints<\/li> <\/ul> <p>Then attempt a basic check. Lumber camps can be established in any hex that contains a significant amount of forest terrain. Mines and quarries can be established in any hex that contains a significant amount of hill or mountain terrain.<\/p>","skills":{"engineering":0},"criticalSuccess":{"msg":"<p>You establish a Work Site in the hex and proceed to discover an unexpectedly rich supply of high quality Commodities. All Commodity yields granted by this site are doubled until the end of the next Kingdom turn.<\/p>","modifiers":[{"name":"Double Mine Yields Next Turn","buttonLabel":"Double Mine Yields Next Turn","value":1,"type":"untyped","turns":1,"selector":"ore","enabled":true}]},"success":{"msg":"<p>You establish a Work Site in the hex.<\/p>"},"failure":{"msg":"<p>You fail to establish a Work Site in the hex.<\/p>"},"criticalFailure":{"msg":"<p>Not only do you fail to establish a Work Site, but you lose several workers to an accident, banditry, a vicious monster, or some other unforeseen occurrence. @gain1Unrest<\/p>"}},{"id":"establish-work-site-quarry","title":"Establish Work Site: Quarry","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>Your hire a crew of workers to travel to a hex that contains Lumber, Ore, or Stone to be harvested. Spend RP as determined by the hex’s most inhospitable terrain:<\/p> <ul> <li><b>Mountains<\/b>: @lose12ResourcePoints<\/li> <li><b>Swamps<\/b>: @lose8ResourcePoints<\/li> <li><b>Forests<\/b>: @lose4ResourcePoints<\/li> <li><b>Hills<\/b>: @lose2ResourcePoints<\/li> <li><b>Plains<\/b>: @lose1ResourcePoints<\/li> <\/ul> <p>Then attempt a basic check. Lumber camps can be established in any hex that contains a significant amount of forest terrain. Mines and quarries can be established in any hex that contains a significant amount of hill or mountain terrain.<\/p>","skills":{"engineering":0},"criticalSuccess":{"msg":"<p>You establish a Work Site in the hex and proceed to discover an unexpectedly rich supply of high quality Commodities. All Commodity yields granted by this site are doubled until the end of the next Kingdom turn.<\/p>","modifiers":[{"name":"Double Quarry Yields Next Turn","buttonLabel":"Double Quarry Yield Next Turn","value":1,"type":"untyped","turns":1,"selector":"stone","enabled":true}]},"success":{"msg":"<p>You establish a Work Site in the hex.<\/p>"},"failure":{"msg":"<p>You fail to establish a Work Site in the hex.<\/p>"},"criticalFailure":{"msg":"<p>Not only do you fail to establish a Work Site, but you lose several workers to an accident, banditry, a vicious monster, or some other unforeseen occurrence. @gain1Unrest<\/p>"}},{"id":"evangelize-the-end","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Evangelize the End","description":"<p>You spend time preaching the End Times. While your sermons certainly aren’t for everyone, your methods avoid deliberately antagonizing those who see hope in the world while simultaneously providing ease and calm to the more desperate among the kingdom’s citizens. Attempt a basic Folklore check to determine how effective your sermons are.<\/p>","skills":{"folklore":0},"criticalSuccess":{"msg":"<p>Your prayers soothe and calm the more criminal-minded citizens for the time being. @lose1d4Unrest, and either @lose2Crime or @lose1Corruption or @lose1Strife.<\/p>"},"success":{"msg":"<p>Your prayers serve to redirect and calm discord. @lose1d3Unrest<\/p>"},"failure":{"msg":"<p>Your prayers serve to redirect and calm discord. @lose1Unrest<\/p>"},"criticalFailure":{"msg":"<p>Your prayers have unsettled some of your citizens. @gain1d4Unrest and @gain1Decay <\/p>"}},{"id":"false-victory","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"False Victory","automationNotes":"activities.false-victory.automationNotes","description":"<p>Your contacts with the criminal underworld and your knack for dodging punishment and claiming responsibility for victories you had no direct role in can be harnessed to engineer false victories to trick the kingdom’s citizens into thinking their leaders are doing more than they actually are to create a safe place to live. Such attempts are not without risks, though, for if things backfire, you can cause problems where none existed in the first place. When setting up a false victory, attempt a basic Intrigue check.<\/p>","skills":{"intrigue":0},"criticalSuccess":{"msg":"<p>At the end of this Kingdom turn’s Event Phase, roll again on the random kingdom events table. Rumors of this event being resolved spread throughout your kingdom. You don’t gain any of the benefits of resolving this false victory, but instead @lose1d6Unrest and one Ruin of your choice by 1<\/p> <ul><li>@lose1Corruption<\/li><li>@lose1Crime<\/li><li>@lose1Decay<\/li><li>@lose1Strife<\/li><\/ul><p>If you randomly roll that same random kingdom event at any time during the next four kingdom turns, you can attempt an Intrigue check with a +1 circumstance bonus to resolve it rather than the normal check to resolve it.<\/p>","modifiers":[{"turns":5,"enabled":false,"value":1,"name":"False Victory: Critical Success","buttonLabel":"+1 Circumstance to Check to skip the Same Event","type":"circumstance","applyIf":[{"eq":["@phase","event"]},{"eq":["@skill","intrigue"]}]}]},"success":{"msg":"<p>Vague rumors of the kingdom’s leaders attaining victories over vague threats spread through the kingdom. @lose1d3Unrest<\/p>"},"failure":{"msg":"<p>The false event fails to manifest, and rumors of the truth spread throughout the kingdom. @gain1Unrest. You cannot attempt False Victory on your next Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>The truth comes out, and the citizens revolt against this attempt to manipulate them. @gain1PublicScandalEvent in addition to any other events that would normally take place. Attempt a DC @Check[type:flat|dc:11|showDC:all] check. On a success, the Public Scandal involves a randomly determined leader, but on a failure, the blame falls on your leader. Regardless of how the Public Scandal plays out, you cannot attempt False Victory again for 6 Kingdom turns.<\/p>"}},{"id":"focused-attention","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":20,"title":"Focused Attention","description":"<p>You set aside time to focus attention on aiding another leader in an activity. Choose another leader and a Kingdom skill, then attempt a DC 20 check using the chosen skill. On a success, you grant that leader a +2 circumstance bonus to one kingdom check using that skill, provided that leader attempts the skill check during the same Kingdom turn.The Cooperative Leadership Kingdom feat increases the efficiency of this activity.<\/p>","skills":{"agriculture":0,"arts":0,"boating":0,"defense":0,"engineering":0,"exploration":0,"folklore":0,"industry":0,"intrigue":0,"magic":0,"politics":0,"scholarship":0,"statecraft":0,"trade":0,"warfare":0,"wilderness":0},"criticalSuccess":{"msg":"<p>You grant that leader a +2 circumstance bonus to one kingdom check using that skill, provided that leader attempts the skill check during the same Kingdom turn<\/p>","modifiers":[{"turns":1,"enabled":false,"isConsumedAfterRoll":true,"buttonLabel":"+2/+3 Circumstance to Aided Check","name":"Focused Attention","value":0,"valueExpression":{"when":{"cases":[{"case":[{"not":{"hasRollOption":"cooperative-leadership"}},2]},{"case":[{"hasRollOption":"cooperative-leadership"},3]}],"default":2}},"type":"circumstance","rollOptions":["focused-attention"]}]},"success":{"msg":"<p>You grant that leader a +2 circumstance bonus to one kingdom check using that skill, provided that leader attempts the skill check during the same Kingdom turn<\/p>","modifiers":[{"turns":1,"enabled":false,"buttonLabel":"+2/+3 Circumstance to Aided Check","name":"Focused Attention","isConsumedAfterRoll":true,"value":0,"valueExpression":{"when":{"cases":[{"case":[{"not":{"hasRollOption":"cooperative-leadership"}},2]},{"case":[{"hasRollOption":"cooperative-leadership"},3]}],"default":2}},"type":"circumstance","rollOptions":["focused-attention"]}]}},{"id":"fortify-hex","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","title":"Fortify Hex","description":"<p>Your command your engineers to construct a protected encampment, such as a fort or barbican, to serve as a defensive post in the hex. Spend RP as determined by the hex’s most inhospitable terrain:<\/p> <ul> <li><b>Mountains<\/b>: @lose12ResourcePoints<\/li> <li><b>Swamps<\/b>: @lose8ResourcePoints<\/li> <li><b>Forests<\/b>: @lose4ResourcePoints<\/li> <li><b>Hills<\/b>: @lose2ResourcePoints<\/li> <li><b>Plains<\/b>: @lose1ResourcePoints<\/li> <\/ul> <p>Then attempt a basic check. A fortified hex grants an additional bonus in warfare, but also gives traveling PCs a place to rest that prevents wandering monsters from interrupting their rest.<\/p>","requirement":"The target hex must be claimed by your kingdom and must not have a settlement in it.","skills":{"defense":0},"criticalSuccess":{"msg":"<p>You find a defensible position for your fortification and finish construction efficiently. Gain a refund of half the RP you spent to build in the hex, then @lose1Unrest<\/p>"},"success":{"msg":"<p>You establish your fortification in the hex. @lose1Unrest<\/p>"},"failure":{"msg":"<p>You fail to fortify the hex.<\/p>"},"criticalFailure":{"msg":"<p>Your attempt ends in disaster. Not only do you fail to build a structure, but you lose several workers to an accident, banditry, a vicious monster, or some other unforeseen occurrence. @gain1Unrest<\/p>"}},{"id":"garrison-army","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Garrison Army","automationNotes":"activities.garrison-army.automationNotes","description":"<p>You move an army into a fortification and assign them to guard it. In order to garrison, the army must be located in a hex that contains a Refuge, Settlement, or Work Site. If you’re garrisoning the army in a Refuge hex, attempt a basic Defense check. If you’re garrisoning the army in a settlement, attempt a basic Politics check. If you’re garrisoning the army in a Work Site hex, attempt a basic Engineering check. This check’s DC increases by 5 if the hex is not part of your kingdom, or by 10 if the location is part of an enemy kingdom.<\/p>","requirement":"The army is in the same hex as a Refuge, Settlement, or Work Site.","modifiers":[{"enabled":false,"value":-5,"buttonLabel":"+5 DC Increase if outside of your kingdom","name":"Outside of Your Kingdom","type":"untyped"},{"enabled":false,"value":-10,"buttonLabel":"+10 DC Increase if in enemy territory","name":"In Enemy Territory","type":"untyped"}],"skills":{"defense":0,"politics":0,"engineering":0},"criticalSuccess":{"msg":"<p>The army becomes fortified until it is deployed. Additionally, the efficiency of the garrisoning reduces this army’s Consumption by 2 (to a minimum of 1) until it is deployed.<\/p>"},"success":{"msg":"<p>The army becomes fortified until it is deployed.<\/p>"},"failure":{"msg":"<p>The army becomes fortified until the next Kingdom turn begins, at which point you must use this activity again to maintain the fortified condition.<\/p>"},"criticalFailure":{"msg":"<p>Your army clashes with local citizens, abuses their authority, lets their watchful readiness slack, and/or provokes confrontations where they are not needed. It does not become fortified, and you cannot attempt to garrison that army at this location again for 4 Kingdom turns. @gain1Unrest<\/p>"}},{"id":"gather-livestock","title":"Gather Livestock","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>Attempt a basic check to gather excess livestock from local wildlife, ranches, and farms. This generates a number of Food commodities.<\/p>","skills":{"wilderness":0},"criticalSuccess":{"msg":"<p>@gain1d4Food<\/p>"},"success":{"msg":"<p>@gain1Food<\/p>"},"failure":{"msg":"<p>Gain no Food commodities.<\/p>"},"criticalFailure":{"msg":"<p>@lose1d4Food to spoilage. If you have no Food to lose, you instead @gain1Unrest<\/p>"}},{"id":"go-fishing","title":"Go Fishing","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>Attempt a basic check to fish for food from the rivers and lakes in your kingdom.<\/p>","requirement":"Must have at least one claimed hex that includes river or lake terrain.","skills":{"boating":0},"criticalSuccess":{"msg":"<p>@gain1d4Food<\/p>"},"success":{"msg":"<p>@gain1Food<\/p>"},"failure":{"msg":"<p>Gain no Food commodities.<\/p>"},"criticalFailure":{"msg":"<p>You lose some fishers to tragic accidents; @gain1Unrest<\/p>"}},{"id":"harvest-crops","title":"Harvest Crops","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control","description":"<p>Attempt a basic check to forage for wild edibles or gather excess crops from farms.<\/p>","skills":{"agriculture":0},"criticalSuccess":{"msg":"<p>@gain1d4Food<\/p>"},"success":{"msg":"<p>@gain1Food<\/p>"},"failure":{"msg":"<p>Gain no Food commodities.<\/p>"},"criticalFailure":{"msg":"<p>@lose1d4Food to spoilage; if you have no Food to lose, you instead @gain1Unrest<\/p>"}},{"id":"harvest-lily-pollen","oncePerRound":false,"fortune":false,"enabled":false,"phase":"region","dc":"control","title":"Harvest Lily Pollen","description":"<p>You or a small group of trained herbalists or naturalists work to harvest and process @UUID[Compendium.pf2e.equipment-srd.Item.MvMa010Je10GN5dx]{Azure Lily Pollen} in hopes of creating a few doses of the poison (detailed on page 584). Attempt a DC 30 Agriculture check. You must then wait 1 Kingdom turn before attempting this activity again, to give the lilies time to recover.<\/p>","skills":{"agriculture":3},"criticalSuccess":{"msg":"<p>You create 2 doses of @UUID[Compendium.pf2e.equipment-srd.Item.MvMa010Je10GN5dx]{Azure Lily Pollen}.<\/p>"},"success":{"msg":"<p>You create 1 dose of @UUID[Compendium.pf2e.equipment-srd.Item.MvMa010Je10GN5dx]{Azure Lily Pollen} but must also attempt a @Check[type:basic|dc:11|showDC:all]. On a failure, some of the poison makes its way into criminal hands; @gain1Crime<\/p>"},"failure":{"msg":"<p>You fail to harvest any @UUID[Compendium.pf2e.equipment-srd.Item.MvMa010Je10GN5dx]{Azure Lily Pollen}, in part because many of the resources make their way into the kingdom’s criminal underworld. @gain1Crime<\/p>"},"criticalFailure":{"msg":"<p>Not only do you fail to harvest any pollen, and not only do resources make their way into the hands of criminals, but whispers and rumors that you allowed this to happen on purpose spread through the kingdom. @gain1d4Unrest, @gain1Corruption, and @gain2Crime<\/p>"}},{"id":"hire-adventurers","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"event","title":"Hire Adventurers","automationNotes":"activities.hire-adventurers.automationNotes","description":"<p>While the PCs can strike out themselves to deal with ongoing events, it’s often more efficient to Hire Adventurers. When you Hire Adventurers to help end an ongoing event, the DC is equal to your Control DC adjusted by the event’s level modifier. @lose1RolledResourceDice each time you attempt this activity. (or @lose1ResourcePoints if you have the <b>Practical Magic<\/b> Feat)<\/p>","skills":{"exploration":0},"criticalSuccess":{"msg":"<p>You end the continuous event.<\/p>"},"success":{"msg":"<p>The continuous event doesn’t end, but you gain a +2 circumstance bonus to resolve the event during the next Event phase.<\/p>","modifiers":[{"turns":2,"buttonLabel":"+2 Circumstance to Resolve Event","name":"Hire Adventurers: Success","enabled":false,"applyIf":[{"in":["continuous","@eventTraits"]}],"value":2,"type":"circumstance"}]},"failure":{"msg":"<p>You fail to end the continuous event. If you try to end the continuous event again, the cost in RP increases to 2 Resource Dice.<\/p>"},"criticalFailure":{"msg":"<p>You fail to end the continuous event. If you try to end the continuous event again, the cost in RP increases to 2 Resource Dice. In addition, word spreads quickly through the region—you can no longer attempt to end this continuous event by Hiring Adventurers.<\/p>"}},{"id":"improve-lifestyle","order":2,"oncePerRound":false,"fortune":false,"enabled":true,"phase":"commerce","dc":"control","title":"Improve Lifestyle","description":"<p>Attempt a basic check to draw upon your kingdom’s treasury to enhance the quality of life for your citizens. This activity can be taken only during the Commerce phase of a Kingdom turn<\/p>","skills":{"politics":0},"criticalSuccess":{"msg":"<p>Your push to Improve Lifestyles affords your citizens significant free time to pursue recreational activities. For the remainder of the Kingdom turn, you gain a +2 circumstance bonus to Culture-based checks.<\/p>","modifiers":[{"turns":1,"name":"Improve Lifestyle: Critical Success","buttonLabel":"+2 Circumstance to Culture","enabled":true,"applyIf":[{"eq":["@ability","culture"]}],"value":2,"type":"circumstance"}]},"success":{"msg":"<p>Your push to Improve Lifestyles helps your citizens enjoy life. For the remainder of the Kingdom turn, you gain a +1 circumstance bonus to Culture-based checks.<\/p>","modifiers":[{"turns":1,"enabled":true,"name":"Improve Lifestyle: Success","buttonLabel":"+1 Circumstance to Culture","applyIf":[{"eq":["@ability","culture"]}],"value":1,"type":"circumstance"}]},"failure":{"msg":"<p>Your push to Improve Lifestyles helps your citizens enjoy life. For the remainder of the Kingdom turn, you gain a +1 circumstance bonus to Culture-based checks. In addition, you’ve strained your treasury. Take a –1 circumstance penalty to Economy-based checks for the remainder of this Kingdom turn.<\/p>","modifiers":[{"turns":1,"enabled":true,"buttonLabel":"-1 Circumstance to Economy","name":"Improve Lifestyle: Failure","applyIf":[{"eq":["@ability","economy"]}],"value":-1,"type":"circumstance"},{"turns":1,"enabled":true,"buttonLabel":"+1 Circumstance to Culture","name":"Improve Lifestyle: Failure","applyIf":[{"eq":["@ability","culture"]}],"value":1,"type":"circumstance"}]},"criticalFailure":{"msg":"<p>Your attempt to Improve Lifestyles backfires horribly as criminal elements in your kingdom abuse your generosity. You take a –1 circumstance penalty to Economy-based checks for the remainder of the Kingdom turn, @gain1Unrest, and add 1 to a Ruin of your choice: <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul><\/p>","modifiers":[{"turns":1,"enabled":true,"buttonLabel":"-1 Circumstance to Economy","name":"Improve Lifestyle: Critical Failure","applyIf":[{"eq":["@ability","economy"]}],"value":-1,"type":"circumstance"}]}},{"id":"infiltration","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Infiltration","description":"<p>You send spies out to gather intelligence on a neighboring nation, a cult or thieves’ guild within your borders, an unclaimed Freehold, or even an unexplored adventure site. Alternately, you can simply send your spies out to investigate the current health of your kingdom. Attempt a basic check.<\/p>","skills":{"intrigue":0},"criticalSuccess":{"msg":"<p>You learn something valuable or helpful. If you were infiltrating a specific target, the GM decides what is learned, but the information is exact and precise. For example, if you were infiltrating an unexplored ruin, you might learn that the site is infested with web lurkers and spider swarms. If you were investigating your kingdom’s health, your spies reveal easy methods to address citizen dissatisfaction, allowing you to choose one of the following: @lose1d4Unrest or reduce a Ruin of your choice by 1<\/p><ul><li>@lose1Corruption<\/li><li>@lose1Crime<\/li><li>@lose1Decay<\/li><li>@lose1Strife<\/li><\/ul>"},"success":{"msg":"<p>You learn something helpful about the target, but the information is vague and imprecise. For example, if you were infiltrating the same ruin mentioned in the critical success above, you might learn that some sort of aberration uses the ruins as its lair. If you were investigating your kingdom’s health, your spies learn enough that you can take action. @lose1Unrest<\/p>"},"failure":{"msg":"<p>Your spies fail to learn anything of import, but they are not themselves compromised.<\/p>"},"criticalFailure":{"msg":"<p>You never hear from your spies again, but someone certainly does! You take a –2 circumstance penalty on all kingdom checks until the end of the next Kingdom turn as counter-infiltration from an unknown enemy tampers with your kingdom’s inner workings.<\/p>","modifiers":[{"turns":2,"enabled":true,"value":-2,"name":"Infiltration: Critical Failure","buttonLabel":"-2 Circumstance to All Checks","type":"circumstance"}]}},{"id":"irrigation","oncePerRound":false,"fortune":false,"enabled":true,"phase":"region","dc":"control",
