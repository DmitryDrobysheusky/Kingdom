/* ---------- modifiers engine ---------- */
function val(x,ctx){
  if(typeof x==="string" && x[0]==="@"){ const k=x.slice(1); return k in ctx ? ctx[k] : undefined; }
  if(typeof x==="string" && /^-?\d+$/.test(x)) return +x;
  return x;
}
function evalE(e,ctx){
  if(!e || typeof e!=="object") return !!e;
  if("eq" in e){ return val(e.eq[0],ctx)===val(e.eq[1],ctx); }
  if("in" in e){ const a=val(e.in[0],ctx), b=val(e.in[1],ctx); if(Array.isArray(b)) return b.includes(a); if(Array.isArray(a)) return a.includes(b); return false; }
  if("gte" in e) return +val(e.gte[0],ctx) >= +val(e.gte[1],ctx);
  if("gt" in e) return +val(e.gt[0],ctx) > +val(e.gt[1],ctx);
  if("lte" in e) return +val(e.lte[0],ctx) <= +val(e.lte[1],ctx);
  if("lt" in e) return +val(e.lt[0],ctx) < +val(e.lt[1],ctx);
  if("some" in e) return e.some.some(x=>evalE(x,ctx));
  if("all" in e) return e.all.every(x=>evalE(x,ctx));
  if("not" in e) return !evalE(e.not,ctx);
  if("hasRollOption" in e) return (ctx.opts||new Set()).has(e.hasRollOption);
  return false;
}
const applies = (m,ctx)=> !m.applyIf || m.applyIf.every(e=>evalE(e,ctx));

/* ctx: {ability, skill, activity, phase, settlement} */
function gatherMods(ctx){
  const L=[], lvl=S.level;
  const c = Object.assign({kingdomLevel:lvl, unrest:S.unrest, skillRank:ctx.skill?S.skills[ctx.skill]:0, eventTraits:[], structure:null, leader:ctx.leader||null, opts:ctx.opts||new Set()}, ctx);
  const push = (m)=>{ m.on = m.enabled!==false; m.hits = applies(m,c); if(m.hits) L.push(m); };
  if(ctx.ability) push({id:"ab",label:AB_RU[ctx.ability],value:mod(S.abilities[ctx.ability]),type:"ability",fixed:true});
  if(ctx.skill){ const r=S.skills[ctx.skill]; push({id:"prof",label:"Мастерство: "+RANKS[r],value:r>0?2*r+lvl:0,type:"proficiency",fixed:true}); }
  // invested leaders
  const inv = investedValue(lvl), seen={};
  for(const l in LEADERS){ const L0=S.leaders[l]; if(L0.invested && !L0.vacant && !seen[LEADERS[l]]){ seen[LEADERS[l]]=1; push({id:"inv-"+LEADERS[l],label:"Назначенный лидер ("+AB_RU[LEADERS[l]]+")",value:inv,type:"status",fixed:true,applyIf:[{eq:["@ability",LEADERS[l]]}]}); } }
  // unrest
  const up=unrestPenalty(S.unrest); if(up) push({id:"unrest",label:"Беспорядки "+S.unrest,value:-up,type:"status",fixed:true});
  // ruins
  for(const r in RUINS){ const p=S.ruins[r].penalty; if(p) push({id:"ruin-"+r,label:RUIN_RU[r],value:-p,type:"item",fixed:true,applyIf:[{eq:["@ability",RUINS[r]]}]}); }
  // vacancies
  const V=S.leaders;
  if(V.ruler.vacant) push({id:"vac-ruler",label:"Вакансия: Правитель",value:-1,type:"untyped",fixed:true});
  const vac = {counselor:[-1,{eq:["@ability","culture"]}],emissary:[-1,{eq:["@ability","loyalty"]}],treasurer:[-1,{eq:["@ability","economy"]}],viceroy:[-1,{eq:["@ability","stability"]}],general:[-4,{eq:["@phase","army"]}],magister:[-4,{eq:["@phase","army"]}],warden:[-4,{eq:["@phase","region"]}]};
  for(const k in vac) if(V[k].vacant) push({id:"vac-"+k,label:"Вакансия: "+LD_RU[k],value:vac[k][0],type:"untyped",fixed:true,applyIf:[vac[k][1]]});
  // settlement structures
  const st = S.settlements.find(x=>x.id===ctx.settlement);
  if(st){
    const i = settInfo(st), cap=i.type.item;
    for(const k in i.bonuses){ const b=i.bonuses[k];
      const cond=[]; if(b.activity) cond.push({eq:["@activity",b.activity]}); if(b.skill) cond.push({eq:["@skill",b.skill]});
      push({id:"str-"+k,label:st.name+": "+b.src+(b.value>cap?" (предел "+cap+")":""),value:Math.min(cap,b.value),type:"item",fixed:true,applyIf:cond}); }
    if(i.eventBonus) push({id:"str-event",label:st.name+": сторожевая башня",value:i.eventBonus,type:"item",fixed:true,applyIf:[{eq:["@phase","event"]}]});
  }
  const noBridge = S.settlements.filter(x=>settInfo(x).lacksBridge).length;
  if(noBridge) push({id:"bridge",label:"Нет моста у поселений у воды",value:-noBridge,type:"item",fixed:true,applyIf:[{eq:["@skill","trade"]}]});
  // features by level
  if(lvl>=4) push({id:"feat-expansion",label:"Эксперт по расширению",value:2,type:"circumstance",fixed:true,applyIf:[{eq:["@activity","claim-hex"]}]});
  // feats
  S.feats.forEach(fs=>{ const f=FEAT[fs.id]; if(!f) return; (f.modifiers||[]).forEach((m,ix)=>{
    push({id:"feat-"+f.id+"-"+ix,label:featName(f)+(m.name&&m.name!==f.name?": "+modName(m.name):""),value:m.value,type:m.type||"untyped",applyIf:m.applyIf,enabled:m.enabled,upgrade:m.upgradeResults,downgrade:m.downgradeResults,toggle:true}); }); });
  // creative solution
  if(c.opts.has("creative-solution")) push({id:"creative",label:"Творческое решение",value:2,type:"circumstance",fixed:true});
  // temp mods
  S.mods.forEach(m=>push(Object.assign({},m,{label:modName(m.label),toggle:true,temp:true})));
  return L;
}
function sumMods(list, off){
  const on = list.filter(m=> off && off.has(m.id) ? false : (m.toggle ? (off&&off.has("+"+m.id)) || m.on : true));
  const by={}, used=new Set(); let total=0;
  on.forEach(m=>{ if(!m.value) { used.add(m.id); return; }
    if(["untyped","vacancy"].includes(m.type)||!m.type){ total+=m.value; used.add(m.id); return; }
    const k=m.type+(m.value>0?"+":"-"); if(!by[k] || Math.abs(m.value)>Math.abs(by[k].value)) by[k]=m; });
  Object.values(by).forEach(m=>{ total+=m.value; used.add(m.id); });
  return {total, used, active:on};
}
/* general skill modifier (no activity context) */
function skillTotal(sk, extra){
  const ctx = Object.assign({ability:SKILLS[sk], skill:sk, activity:null, phase:null}, extra||{});
  const L = gatherMods(ctx);
  return {total: sumMods(L).total, list:L};
}

/* ---------- persistence ---------- */
let db=null, canWrite=true, mode="local", coreRef=null, logRef=null, saveT=null, pending=false, lastSaved="";
function saveLocal(){ try{ localStorage.setItem("km-state", JSON.stringify(S)); localStorage.setItem("km-log", JSON.stringify(LOG.slice(0,150))); }catch(e){} }
function loadLocal(){ try{ const s=localStorage.getItem("km-state"); if(s) S=normalize(JSON.parse(s)); const l=localStorage.getItem("km-log"); if(l) LOG=JSON.parse(l)||[]; }catch(e){} }
function commit(noRender){
  if(!noRender) render();
  if(!canWrite) return;
  pending=true; clearTimeout(saveT); saveT=setTimeout(flush, 500);
}
async function flush(){
  saveT=null;
  if(mode==="gas"){ saveLocal(); return gasFlush(); }
  if(mode!=="db"){ saveLocal(); pending=false; return; }
  const body = JSON.parse(JSON.stringify(S)); const js=JSON.stringify(body);
  if(js===lastSaved){ pending=false; return; }
  try{ await coreRef.set(body); lastSaved=js; }catch(e){ handleWriteErr(e); }
  pending=false;
}
let logT=null;
function addLog(text){
  LOG.unshift({t:Date.now(),x:text,turn:S.turn.n}); LOG=LOG.slice(0,150);
  if(!canWrite) return;
  if(mode==="gas"){ gasLogQ.push(LOG[0]); clearTimeout(logT); logT=setTimeout(gasSendLog,400); return; }
  clearTimeout(logT); logT=setTimeout(async()=>{ if(mode!=="db"){ saveLocal(); return; } try{ await logRef.set({entries:LOG}); }catch(e){ handleWriteErr(e); } },400);
}
function handleWriteErr(e){
  if(e && (e.code==="invalid_argument"||e.code==="not_granted")){ canWrite=false; document.body.classList.add("readonly"); setSync(); toast("Изменения не сохранились: у вас доступ только на просмотр"); render(); }
  else if(e && e.code==="quota_exceeded") toast("Хранилище заполнено: "+(e.message||""));
  else toast("Не удалось сохранить, попробую ещё раз при следующем изменении");
}
function setSync(){
  const el=document.getElementById("sync");
  if(mode==="gas"){ el.textContent=gasOnline?"Google · онлайн":"Google · нет связи"; el.className="sync "+(gasOnline?"on":"ro"); return; }
  if(mode==="db" && canWrite){ el.textContent="Общее · онлайн"; el.className="sync on"; }
  else if(mode==="db"){ el.textContent="Только просмотр"; el.className="sync ro"; }
  else { el.textContent="На этом устройстве"; el.className="sync"; }
}
async function initDb(){
  if(!window.claude || !window.claude.use) return;
  let d=null; try{ d = await window.claude.use("db"); }catch(e){}
  if(!d) return;
  db=d; mode="db";
  coreRef = db.doc("kingdom/main"); logRef = db.doc("kingdom/log");
  try{ const u = await window.claude.use("user"); if(u){ const w = await u.can("data.write"); if(w===false){ canWrite=false; document.body.classList.add("readonly"); } } }catch(e){}
  setSync();
  let first=true;
  coreRef.onSnapshot(snap=>{
    if(snap.exists){
      const data=snap.data(); const js=JSON.stringify(data);
      if(pending || js===JSON.stringify(S)) { if(first){first=false;} return; }
      lastSaved=js; S=normalize(JSON.parse(js));
      if(!document.activeElement || !document.activeElement.matches("input,textarea,select") ) render(); else deferRender=true;
    } else if(first && canWrite){
      // migrate anything kept locally before the shared store existed
      let local=null; try{ local=localStorage.getItem("km-state"); }catch(e){}
      if(local){ S=normalize(JSON.parse(local)); render(); }
      commit(true);
    }
    first=false;
  }, e=>{ mode="local"; setSync(); });
  logRef.onSnapshot(snap=>{ if(snap.exists){ const d=snap.data(); LOG=Array.isArray(d.entries)?d.entries.slice():[]; if(UI.tab==="turn") renderLogOnly(); } }, ()=>{});
}

let API="", gasVer=0, gasBase="{}", gasLogN=0, gasLogQ=[], gasOnline=false, gasSaving=false, gasPollT=null;
try{ const m=/[#&]api=([^&]+)/.exec(location.hash||""); if(m){ API=decodeURIComponent(m[1]); localStorage.setItem("km-api",API); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} } else { const v=localStorage.getItem("km-api"); API = v==="off" ? "" : (v||window.KM_API||""); } }catch(e){ API=window.KM_API||""; }
async function gasGet(action){ const r=await fetch(API+(API.includes("?")?"&":"?")+"action="+action+"&_="+Date.now(),{cache:"no-store",redirect:"follow"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function gasPost(obj){ const r=await fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
const isObj = v => v && typeof v==="object" && !Array.isArray(v);
const same = (a,b) => JSON.stringify(a)===JSON.stringify(b);
function merge3(base, mine, theirs){
  if(!isObj(mine) || !isObj(theirs)) return same(mine,base)? theirs : mine;
  const out={}, keys=new Set([...Object.keys(mine),...Object.keys(theirs)]);
  keys.forEach(k=>{ const b=isObj(base)?base[k]:undefined, m=mine[k], t=theirs[k];
    if(same(m,b)) { if(t!==undefined) out[k]=t; }
    else if(same(t,b)) { if(m!==undefined) out[k]=m; }
    else if(isObj(m)&&isObj(t)) out[k]=merge3(b,m,t);
    else if(m!==undefined) out[k]=m; });
  return out;
}
function applyRemote(d){
  if(d.state){ const js=JSON.stringify(d.state); gasBase=js; if(js!==JSON.stringify(S)){ S=normalize(JSON.parse(js)); saveLocal();
    if(!document.activeElement || !document.activeElement.matches("input,textarea,select")) render(); else deferRender=true; } }
  gasVer=d.version||0;
  if(Array.isArray(d.log)){ LOG=d.log; gasLogN=d.logN||0; if(UI.tab==="turn") renderLogOnly(); }
}
async function initGas(){
  mode="gas"; gasOnline=false; setSync();
  try{
    const d=await gasGet("get"); gasOnline=true;
    if(d.state) applyRemote(d);
    else { gasVer=d.version||0; gasBase="{}"; LOG=d.log||LOG; gasLogN=d.logN||0; pending=true; gasFlush(); toast("Таблица была пустой — записал в неё текущее королевство"); }
  }catch(e){ gasOnline=false; toast("Не удалось подключиться к Таблице. Проверьте ссылку на скрипт"); }
  setSync(); render();
  clearInterval(gasPollT); gasPollT=setInterval(gasPoll,5000);
}
async function gasPoll(){
  if(mode!=="gas" || document.hidden || gasSaving || pending) return;
  try{ const v=await gasGet("ver"); if(!gasOnline){ gasOnline=true; setSync(); }
    if(v.version!==gasVer || v.logN!==gasLogN){ const d=await gasGet("get"); if(!pending && !gasSaving) applyRemote(d); } }
  catch(e){ if(gasOnline){ gasOnline=false; setSync(); } }
}
async function gasFlush(){
  if(gasSaving){ saveT=setTimeout(flush,700); return; }
  gasSaving=true;
  try{
    let mine=JSON.parse(JSON.stringify(S)), res=await gasPost({action:"save",base:gasVer,state:mine}), tries=0;
    while(res && res.conflict && tries<3){
      tries++;
      const merged=merge3(JSON.parse(gasBase||"{}"), mine, res.state||{});
      gasVer=res.version; gasBase=JSON.stringify(res.state||{}); S=normalize(merged); mine=JSON.parse(JSON.stringify(S));
      res=await gasPost({action:"save",base:gasVer,state:mine});
      render(); toast("Кто-то менял королевство одновременно с вами — изменения объединены");
    }
    if(res && res.ok){ gasVer=res.version; gasBase=JSON.stringify(mine); pending=false; if(!gasOnline){gasOnline=true; setSync();} }
    else throw new Error(res&&res.error||"save failed");

async function gasSendLog(){

  try{ const r=await gasPost({action:"log",entries:batch.reverse()}); if(r&&r.logN) gasLogN=r.logN; }

/* resource changes used by effect buttons */
function changeRuin(r, d){
  const R=S.ruins[r]; R.value=Math.max(0,R.value+d);
  let msg = (d>0?"+":"−")+Math.abs(d)+" "+RUIN_RU[r];
  if(R.value>R.threshold && R.penalty<4){ R.value=0; R.penalty+=1; msg+=` — порог превышен: штраф ${RUIN_RU[r]} теперь −${R.penalty}, значение сброшено`; }
  else if(d<0 && R.value===0 && R.penalty>0){ msg+=` — ${RUIN_RU[r]} на нуле: можно чистой проверкой СЛ 16 снизить штраф на 1`; }
  return msg;
}
function changeUnrest(d){
  const a=anarchyAt(); const before=S.unrest; S.unrest=Math.max(0,Math.min(a,S.unrest+d));
  let msg=`Беспорядки ${before} → ${S.unrest}`; if(S.unrest>=a && before<a) msg+=" — АНАРХИЯ";
  return msg;
}

  Decay:{ru:"Упадок",f:d=>changeRuin("decay",d)}, Strife:{ru:"Распри",f:d=>changeRuin("strife",d)},
  Fame:{ru:"Слава",f:d=>{ S.fame=Math.max(0,Math.min(3,S.fame+d)); return "Слава: "+S.fame; }},
  FameNextTurn:{ru:"Слава в следующем ходу",f:d=>{ S.next.fame+=d; return "Слава в следующем ходу: +"+S.next.fame; }},

const EVENTS_RU = {BanditActivityEvent:"событие «Бандиты»",CropFailureEvent:"событие «Неурожай»",MonsterActivityEvent:"событие «Монстры»",PlagueEvent:"событие «Чума»",PublicScandalEvent:"событие «Скандал»",SquattersEvent:"событие «Самозахватчики»"};
function applyFx(dir, amt, res){
  let n; let rollTxt="";
  if(/d/.test(amt)){ const r=rollFormula(amt); n=r.total; rollTxt=` (${amt}: ${r.parts.join("+")})`; } else n=+amt;
  const d = dir==="gain"? n : -n; const R=RES[res];
  let msg;
  if(!R) return null;
  if(R.dice){ const die=sizeInfo(S.size).die; let t=0,p=[]; for(let i=0;i<Math.abs(d);i++){const x=rnd(die);p.push(x);t+=x;} const dd = d>0?t:-t; S.rp=Math.max(0,S.rp+dd); msg=`${d>0?"+":"−"}${Math.abs(d)}d${die} ПР (${p.join("+")}) → ПР: ${S.rp}`; }
  else if(R.c){ const cap=storage()[R.c]; const before=S.commodities[R.c]; S.commodities[R.c]=Math.max(0,Math.min(cap,before+d)); msg=`${R.ru}: ${before} → ${S.commodities[R.c]}`+(before+d>cap?` (склад ${cap})`:""); }
  else msg=R.f(d);
  return msg+rollTxt;
}
function renderRich(html, withFx){
  if(!html) return "";
  let s = String(html);
  s = s.replace(/@UUID\[[^\]]*\]\{([^}]*)\}/g,"$1").replace(/@UUID\[[^\]]*\]/g,"").replace(/\[\[\/r ([^#\]]+)(?:#[^\]]*)?\]\]/g,"<b>$1</b>");
  s = s.replace(/@Check\[([^\]]*)\]/g,(m,body)=>{ const dc=(body.match(/dc:(\d+)/)||[])[1]; const flat=/flat/.test(body);
    return withFx? `<button class="fx" data-a="flat" data-dc="${dc}">чистая проверка СЛ ${dc}</button>` : `<b>${flat?"чистую проверку":"проверку"} СЛ ${dc}</b>`; });
  s = s.replace(/@(gain|lose)(Multiple)?(\d+d\d+|\d+)(\w+)/g,(m,dir,mult,amt,res)=>{
    if(EVENTS_RU[res]) return `<span class="fx neutral">${dir==="gain"?"+":"−"}${amt} ${EVENTS_RU[res]}</span>`;
    const R=RES[res]; const nm = R? R.ru : res;
    const lbl = `${dir==="gain"?"+":"−"}${amt} ${nm}${mult?" (за каждый)":""}`;
    if(!R || !withFx) return `<b>${lbl}</b>`;
    return `<button class="fx ro-hide" data-a="fx" data-dir="${dir}" data-amt="${amt}" data-res="${res}">${lbl}</button><b class="ro-only" hidden>${lbl}</b>`;
  });
  return s;
}

function reqText(f){
  const r=f.requirements; if(!r||!r.skillRanks) return "";

}
function modsList(){
  if(!S.mods.length) return `<div class="muted small">Сейчас ничего не действует. Кнопки эффектов в результатах бросков добавляют их сюда.</div>`;

    <p>${condText(m.applyIf)}${m.turns?` · ещё ${m.turns} ${m.turns===1?"ход (до конца текущего)":"хода"}`:""}${m.consume?" · расходуется после броска":""}</p></div><button class="btn sm ghost danger ro-hide" data-a="rmmod" data-i="${i}">Убрать</button></div>`).join("")}</div>`;
}
function condText(c){
  if(!c||!c.length) return "ко всем проверкам";
  return c.map(e=>{
    if(e.eq){ const [a,b]=e.eq; if(a==="@ability") return "проверки "+(AB_RU[b]||b); if(a==="@skill") return "навык "+(SK_RU[b]||b); if(a==="@activity") return "действие «"+(ACT[b]?actTitle(ACT[b]):b)+"»"; if(a==="@phase") return "фаза "+(PH_RU[b]||b); }
    if(e.in){ const [a,b]=e.in; if(a==="@activity"&&Array.isArray(b)) return "действия: "+b.filter(x=>ACT[x]).map(x=>actTitle(ACT[x])).join(", "); if(a==="@ability"&&Array.isArray(b)) return "проверки "+b.map(x=>AB_RU[x]).join(" и "); if(a==="@phase"&&Array.isArray(b)) return "фазы "+b.map(x=>PH_RU[x]).join(", "); if(b==="@eventTraits") return "события с признаком «"+a+"»"; }
    return "особое условие";
  }).join(" · ");
}

/* ---------- turn ---------- */
function viewTurn(){
  const rd=resourceDice(), inc=income(), cons=consumption(), u=upkeepUnrest(), st=S.turn.steps;
  const step=(k,no,title,body)=>`<div class="turnstep ${st[k]?"done":""}"><div class="no">${st[k]?"✓":no}</div><div><h3>${title}</h3>${body}</div></div>`;
  const nextTxt = [S.next.rp?`${fmt(S.next.rp)} ПР`:"",S.next.rd?`${fmt(S.next.rd)} кост.`:"",S.next.fame?`+${S.next.fame} Славы`:""].filter(Boolean).join(", ");
  let h = ribbon();
  h += `<section class="card"><div class="sec-h"><h2>Ход ${S.turn.n}</h2><span class="aside">порядок из книги: Содержание → Торговое → Действия → Событие</span></div>`;
  h += step("fame",1,"Начало хода: лидеры и Слава",`<p>Если кто-то сменил роль или роль пустует — действие «Новый лидер». В начале хода королевство получает 1 очко Славы (максимум 3).${nextTxt?` Отложенное с прошлого хода: <b>${nextTxt}</b>.`:""}</p>
    <div class="row ro-hide"><button class="btn sm" data-a="dofame">+1 ${S.fameType==="infamy"?"Бесславия":"Славы"}${nextTxt?" и применить отложенное":""}</button><button class="btn sm ghost" data-a="openact" data-id="new-leadership">Новый лидер</button></div>`);
  const uAuto = u.over + u.war;
  h += step("unrest",2,"Корректировка Беспорядков",`<p>Перенаселённых поселений: ${u.over} (+1 каждое)${u.war?", война: +1":""}${u.ruler?", правитель не назначен: +1d4":""}. ${S.unrest>=10?`<b style="color:var(--bad)">Беспорядки ${S.unrest} ≥ 10:</b> 1d10 очков Развалин распределите по выбору, и чистая проверка СЛ 11 — при успехе теряете гекс на выбор.`:""}</p>
    <div class="row ro-hide"><button class="btn sm" data-a="doupkeepunrest">Применить (+${uAuto}${u.ruler?" +1d4":""})</button>${S.unrest>=10?`<button class="btn sm" data-a="unrest10">Бросить 1d10 и СЛ 11</button>`:""}</div>`);
  h += step("collect",3,"Сбор ресурсов",`<p>Бросьте ${rd.n}d${rd.die} — это ваши ПР на ход. Рабочие площадки дают: древесина +${inc.lumber}, руда +${inc.ore}, камень +${inc.stone}, роскошь +${inc.luxuries} (сверх склада не хранится).</p>
    <div class="row ro-hide"><button class="btn sm pri" data-a="docollect">Бросить ${rd.n}d${rd.die} и собрать</button><span class="small muted">или вписать своё:</span><input class="inp n" id="rp-manual" type="number" style="width:80px" placeholder="ПР"><button class="btn sm" data-a="docollectmanual">Принять</button></div>`);
  h += step("consume",4,"Оплата потребления",`<p>Нужно ${cons.total} еды, на складе ${S.commodities.food}. Если еды не хватает: за каждую недостающую единицу 5 ПР, либо не платить и получить 1d4 Беспорядков.</p>
    <div class="row ro-hide"><button class="btn sm" data-a="payfood">Оплатить едой</button>${cons.total>S.commodities.food?`<button class="btn sm" data-a="payrp">Доплатить ${(cons.total-S.commodities.food)*5} ПР</button><button class="btn sm" data-a="payunrest">Не платить: +1d4 Беспорядков</button>`:""}</div>`);
  h += step("commerce",5,"Торговое",`<p>Сбор налогов${S.turn.taxesLast?" (в прошлом ходу налоги собирали — успех и провал дадут лишние Беспорядки)":""}, одобрение расходов, торговля.</p><div class="row"><button class="btn sm ghost" data-a="gophase" data-ph="commerce">Открыть торговые действия</button>
    <button class="btn sm ghost ro-hide" data-a="skiptaxes">Не собирать налоги: СЛ 11 на −1 Беспорядки</button></div>`);
  h += step("activities",6,"Действия: Лидерство, Регион, Городское",`<p>Лидерство — по одному на лидера-PC${S.settlements.some(x=>settInfo(x).leadershipUp)?" (ратуша/замок/дворец в столице дают больше)":""}; Регион — 3 действия; Городское — по одному в каждом поселении.</p><div class="row"><button class="btn sm ghost" data-a="gophase" data-ph="leadership">Лидерство</button><button class="btn sm ghost" data-a="gophase" data-ph="region">Регион</button><button class="btn sm ghost" data-a="gophase" data-ph="civic">Городское</button></div>`);
  h += step("event",7,"Фаза событий",`<p>Мастер бросает чистую проверку СЛ 16 на событие (СЛ снижается на 5 за каждый ход без события). Бонус лидера, указанного в событии, и сторожевых башен учитывается при броске события.</p>
    <div class="row"><button class="btn sm" data-a="eventcheck">Проверка события (СЛ ${16-5*(S.turn.noEvent||0)})</button></div>`);
  h += `</section>`;
  h += `<section class="card"><div class="sec-h"><h2>Завершить ход</h2></div><p class="small muted" style="margin:0">Неизрасходованные ПР превращаются в опыт 1:1 (не больше 120), эффекты «до конца хода» снимаются, счётчики действий обнуляются.</p>
    <div class="row ro-hide"><button class="btn pri" data-a="endturn">Завершить ход ${S.turn.n} (+${Math.min(120,S.rp)} опыта)</button></div></section>`;
  h += `<section class="card"><div class="sec-h"><h2>Журнал</h2><span class="aside">броски и изменения видны всей партии</span></div><div class="log" id="log">${logHtml()}</div></section>`;
  return h;
}
function logHtml(){
  if(!LOG.length) return `<div class="muted small">Пока пусто. Здесь появятся броски и применённые эффекты.</div>`;

/* ---------- actions ---------- */
function actSkills(a){ return Object.keys(a.skills||{}); }
function actCard(a, ab){
  const used=S.turn.used[a.id]||0, allSks=actSkills(a);
  const sks = ab? allSks.filter(s=>SKILLS[s]===ab) : [];

    <div class="t1"><b>${esc(actTitle(a))}</b>${used?`<span class="chip good">×${used}</span>`:""}</div>
    ${LANG==="ru"&&ru("act",a.id,"title")?`<span class="en">${esc(a.title)}</span>`:""}
    <div class="sks">${ab? sks.map(s=>`<span class="skt ab-${s?SKILLS[s]:""}">${SK_RU[s]} <b class="mono">${fmt(skillTotal(s,{activity:a.id,phase:a.phase}).total)}</b>${a.skills[s]?" · нужно "+RANKS[a.skills[s]].toLowerCase():""}</span>`).join("") : `<span class="skt" style="--ab:var(--muted)">любой навык</span>`}
    ${a.oncePerRound?`<span class="chip">раз за ход</span>`:""}${a.enabled===false?`<span class="chip">сюжет</span>`:""}</div></button>`;

function viewActions(){
  const q=UI.q.trim().toLowerCase();
  let list = D.activities.filter(a=> UI.showStory || a.enabled!==false || S.turn.used[a.id]);
  if(UI.phase!=="all") list=list.filter(a=>a.phase===UI.phase);
  if(q) list=list.filter(a=> (actTitle(a)+" "+a.title+" "+actSkills(a).map(s=>SK_RU[s]).join(" ")).toLowerCase().includes(q));
  let h = `<div class="row"><input class="inp" id="f-q" placeholder="Поиск действия или навыка" value="${esc(UI.q)}" style="flex:1"><label class="row small"><input type="checkbox" id="f-story" ${UI.showStory?"checked":""}> сюжетные</label></div>
  <div class="filters">${["all"].concat(PHASES).map(p=>`<button class="fbtn" data-a="phase" data-ph="${p}" aria-pressed="${UI.phase===p}">${p==="all"?"Все фазы":PH_RU[p]}</button>`).join("")}</div>`;
  const phases = UI.phase==="all"?PHASES:[UI.phase];
  const sortF=(x,y)=>(x.order||99)-(y.order||99)||actTitle(x).localeCompare(actTitle(y));
  for(const p of phases){
    const items=list.filter(a=>a.phase===p).sort(sortF);
    if(!items.length) continue;
    h += `<div class="phase-h">${PH_RU[p]} <span>${items.length}</span></div>`;
    for(const ab of ABIL){
      const g=items.filter(a=>actSkills(a).length<16 && actSkills(a).some(s=>SKILLS[s]===ab));
      if(!g.length) continue;
      h += `<div class="ab-h ab-${ab}"><b>${AB_RU[ab]}</b><span class="mono">${fmt(mod(S.abilities[ab]))}</span><span class="muted small">${g.length}</span></div><div class="acts">${g.map(a=>actCard(a,ab)).join("")}</div>`;
    }
    const any=items.filter(a=>actSkills(a).length>=16 || !actSkills(a).length);
    if(any.length) h += `<div class="ab-h" style="--ab:var(--muted)"><b>Любой навык</b><span class="muted small">${any.length}</span></div><div class="acts">${any.map(a=>actCard(a,null)).join("")}</div>`;
  }
  if(!list.length) h+=`<div class="banner">Ничего не нашлось. Попробуйте другое слово или «Все фазы».</div>`;
  return h;
}

/* ---------- roll sheet ---------- */
function openAct(id, preset){
  const a=ACT[id]; if(!a) return;
  const sks = preset&&preset.skills ? preset.skills.map(x=>x.skill) : actSkills(a);
  let best=null, bestV=-99;
  const pab = preset && preset.ab;
  const pool = (pab && sks.some(s=>SKILLS[s]===pab)) ? sks.filter(s=>SKILLS[s]===pab) : sks;
  pool.forEach(s=>{ const v=skillTotal(s,{activity:id,phase:a.phase}).total; if(v>bestV){bestV=v;best=s;} });
  const cap = S.settlements.find(x=>x.capital) || S.settlements[0];
  let dc = typeof a.dc==="number"? a.dc : controlDC() + (DC_ADJ[id]||0);
  if(preset && preset.dc) dc=preset.dc;
  if(id==="establish-farmland") dc=controlDC();
  UI.sheet={kind:"roll", id, skill:(preset&&preset.skill)||best, settlement:cap?cap.id:null, dc, dcAuto:!(preset&&preset.dc)&&typeof a.dc!=="number", off:new Set(), opts:new Set(), result:null, preset:preset||null, manual:"", usedAtOpen:S.turn.used[id]||0};
  renderSheet();
}
function rollCtx(){
  const sh=UI.sheet, a=ACT[sh.id];
  return {ability:SKILLS[sh.skill], skill:sh.skill, activity:sh.id, phase:a.phase, settlement:sh.settlement, opts:sh.opts};
}
function sheetRoll(){
  const sh=UI.sheet, a=ACT[sh.id];
  const sks = sh.preset&&sh.preset.skills ? sh.preset.skills : actSkills(a).map(s=>({skill:s,proficiencyRank:a.skills[s]||0}));
  const L = sh.skill? gatherMods(rollCtx()) : [];
  const sum = sumMods(L, sh.off);
  const once = a.oncePerRound && sh.usedAtOpen;
  const rulesInner = `${renderRich(actTxt(a,"description"))}
    ${actTxt(a,"requirement")?`<p><b>Требование.</b> ${renderRich(actTxt(a,"requirement"))}</p>`:""}
    ${actTxt(a,"special")?`<p><b>Особое.</b> ${renderRich(actTxt(a,"special"))}</p>`:""}`;
  const longRules = rulesInner.replace(/<[^>]+>/g,"").length>520 || (sh.preset&&sh.preset.structure);
  let h = longRules? `<details class="rd"><summary>Правила действия</summary><div class="rules" style="margin-top:6px">${rulesInner}</div></details>` : `<div class="rules">${rulesInner}</div>`;
  if(sh.preset && sh.preset.structure){ const s=STR[sh.preset.structure]; h+=`<div class="banner">Строим: <b>${esc(strName(s))}</b> · ${costText(s)}</div>`; }
  if(once) h+=`<div class="banner bad">Это действие уже выполнено в этом ходу, а повторять его нельзя.</div>`;
  if(sh.id==="quell-unrest" && S.turn.quellLast) h+=`<div class="banner">В прошлом ходу беспорядки подавляли навыком «${SK_RU[S.turn.quellLast]}» — его сейчас использовать нельзя.</div>`;
  h += `<div><div class="small muted" style="margin-bottom:6px">Навык</div><div class="skpick">${sks.map(o=>{ const s=o.skill; const need=o.proficiencyRank||0; const locked=S.skills[s]<need;
    const v=sumMods(gatherMods(Object.assign(rollCtx(),{skill:s,ability:SKILLS[s]})),sh.off).total;
    return `<button class="skb ab-${SKILLS[s]} ${locked?"locked":""}" data-a="pickskill" data-sk="${s}" aria-pressed="${sh.skill===s}"><span class="nm">${SK_RU[s]}</span><span class="m">${fmt(v)}</span>${need?`<span class="small muted">нужно: ${RANKS[need].toLowerCase()}</span>`:""}</button>`; }).join("")}</div></div>`;
  h += `<div class="row">${S.settlements.length?`<label class="f" style="flex:1;min-width:160px">Поселение (бонусы построек)<select class="inp" id="rs-sett"><option value="">— без поселения —</option>${S.settlements.map(s=>`<option value="${s.id}" ${s.id===sh.settlement?"selected":""}>${esc(s.name)}${s.capital?" (столица)":""}</option>`).join("")}</select></label>`:""}
    <label class="f" style="width:130px">СЛ${sh.dcAuto?" (контроля"+(DC_ADJ[sh.id]?" +"+DC_ADJ[sh.id]:"")+")":""}<input class="inp n" id="rs-dc" type="number" value="${sh.dc}"></label>
    ${S.creative>0?`<label class="row small" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="rs-creative" ${sh.opts.has("creative-solution")?"checked":""}> Творческое решение (+2), осталось ${S.creative}</label>`:""}</div>`;
  if(String(a.dc)!=="control" && typeof a.dc!=="number" && !(sh.preset&&sh.preset.dc)) h+=`<div class="small muted">СЛ этого действия особый (${a.dc==="custom"?"по постройке или решению мастера":a.dc==="negotiation"||a.dc==="negotiationOrControl"?"СЛ переговоров с группой":a.dc==="event"?"СЛ события":"по решению мастера"}); по умолчанию подставлен СЛ контроля — поправьте при необходимости.</div>`;
  h += `<div class="mods">${L.map(m=>{ const on = sum.active.includes(m); const counted = sum.used.has(m.id)&&on;
    const cb = m.toggle? `<input type="checkbox" data-a="togglemod" data-id="${m.id}" ${on?"checked":""} aria-label="учитывать">` : `<span></span>`;
    return `<div class="mod ${counted?"":"off"}">${cb}<span>${esc(m.label)}<span class="ty">${TYPE_RU[m.type]||""}${on&&!counted?" · не суммируется":""}</span></span><span class="v">${m.value||!(m.upgrade||m.downgrade)?fmt(m.value):"эфф."}</span></div>`; }).join("")}</div>`;
  h += `<div class="tot-line"><span class="small muted">d20</span><span class="big">${fmt(sum.total)}</span><span class="small muted">против СЛ</span><span class="big">${sh.dc}</span><span class="spacer"></span>
    <input class="inp n" id="rs-manual" type="number" min="1" max="20" placeholder="свой d20" style="width:112px" value="${esc(sh.manual)}"><button class="btn pri" data-a="doroll">Бросить</button></div>`;
  if(sh.result) h += resultHtml(sh.result, a);
  h += `<details class="rd"><summary>Все исходы</summary><div class="rules">${DEG.slice().reverse().map(d=>a[d]?`<div class="oc ${DEG_C[d]}"><h4>${DEG_RU[d]}</h4>${renderRich(actTxt(a,d))}</div>`:"").join("")}</div></details>`;
  return h;
}
function degreeOf(total, dc, nat){
  let d = total>=dc+10?3: total>=dc?2: total>dc-10?1:0;
  if(nat===20) d=Math.min(3,d+1); if(nat===1) d=Math.max(0,d-1);
  return d;
}
function doRoll(reroll){
  const sh=UI.sheet, a=ACT[sh.id];
  if(!sh.skill){ toast("Выберите навык"); return; }
  const L=gatherMods(rollCtx()), sum=sumMods(L, sh.off);
  let nat = +sh.manual; const manual = nat>=1 && nat<=20; if(!manual) nat=rnd(20);
  const total = nat + sum.total;
  let d = degreeOf(total, sh.dc, nat), notes=[];
  sum.active.forEach(m=>{ (m.upgrade||[]).forEach(u=>{ if(DEG[d]===u.upgrade && d<3){ d++; notes.push(m.label+": результат улучшен"); } });
                          (m.downgrade||[]).forEach(u=>{ if(DEG[d]===u.downgrade && d>0){ d--; notes.push(m.label+": результат ухудшен"); } }); });
  if(S.unrest>=anarchyAt() && d>0){ d--; notes.push("Анархия: результат ухудшен на ступень"); }
  const deg=DEG[d];
  // consume
  if(sh.opts.has("creative-solution")){ S.creative=Math.max(0,S.creative-1); sh.opts.delete("creative-solution"); notes.push("Потрачено Творческое решение"); }
  const consumed = sum.active.filter(m=>m.temp && m.consume && sum.used.has(m.id));
  if(consumed.length){ S.mods = S.mods.filter(m=>!consumed.some(c=>c.id===m.id)); notes.push("Израсходованы эффекты: "+consumed.map(m=>m.label).join(", ")); }
  if(!reroll){ S.turn.used[a.id]=(S.turn.used[a.id]||0)+1; }
  if(a.id==="collect-taxes") S.turn.taxesThis=true;
  if(a.id==="quell-unrest") S.turn.quellThis=sh.skill;
  sh.result = {nat, mod:sum.total, total, dc:sh.dc, deg, notes, manual, done:{}, reroll:!!reroll};
  sh.manual="";
  const who = sh.preset&&sh.preset.structure ? " — "+strName(STR[sh.preset.structure]) : "";
  addLog(`${actTitle(a)}${who}: ${SK_RU[sh.skill]} ${nat}${fmt(sum.total)} = ${total} против СЛ ${sh.dc} → ${DEG_RU[deg]}${reroll?" (переброс за Славу)":""}${manual?" (свой бросок)":""}`);
  commit(true); render();
  const res=document.querySelector("#sheetbox .result"); if(res) res.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function modLabel(m){
  const v = m.value? fmt(m.value)+" ": "";

}
function modRu(m){

  if(m.turns) s += m.turns===1? ", до конца хода":", до конца следующего хода";

}
function costText(s){
  const c=s.construction||{}; const parts=[];
  if(c.rp) parts.push(c.rp+" ПР"); ["lumber","stone","ore","luxuries"].forEach(k=>{ if(c[k]) parts.push(c[k]+" "+COMM_RU[k].toLowerCase()); });
  return (parts.join(", ")||"бесплатно")+(c.dc?` · СЛ ${c.dc}`:"")+(c.skills?` · ${c.skills.map(x=>SK_RU[x.skill]+(x.proficiencyRank?" ("+RANKS[x.proficiencyRank].toLowerCase()+")":"")).join(" / ")}`:"");
}

  doroll(){ const m=document.getElementById("rs-manual"); UI.sheet.manual=m?m.value:""; doRoll(false); },
  famereroll(){ if(S.fame<1) return; S.fame-=1; addLog("Потрачено 1 очко Славы на переброс"); doRoll(true); },
  fx(el){ const k="fx"+[...el.parentNode.querySelectorAll('[data-a="fx"]')].indexOf(el); if(el.classList.contains("done")) return;
    const msg=applyFx(el.dataset.dir, el.dataset.amt, el.dataset.res); if(!msg) return; el.classList.add("done"); el.textContent="✓ "+msg; addLog(msg); commit(true);
    // keep the sheet as is (button marked), refresh background view
    const v=document.getElementById("view"); const fn={kingdom:viewKingdom,turn:viewTurn,actions:viewActions,settlements:viewSettlements}[UI.tab]; v.innerHTML=fn(); },
  flat(el){ const r=rnd(20), dc=+el.dataset.dc; const ok=r>=dc; el.textContent=`чистая СЛ ${dc}: выпало ${r} — ${ok?"успех":"провал"}`; el.classList.add("done"); addLog(`Чистая проверка СЛ ${dc}: ${r} — ${ok?"успех":"провал"}`); commit(true); },
  addoutmod(el){ const r=UI.sheet.result; const i=+el.dataset.i; if(r.done["m"+i]) return; const a=ACT[UI.sheet.id]; const m=a[r.deg].modifiers[i];
    S.mods.push({id:uid(),label:(m.name||actTitle(a)),value:m.value||0,type:m.type||"untyped",applyIf:m.applyIf||null,turns:m.turns||0,consume:!!m.isConsumedAfterRoll,upgrade:m.upgradeResults,downgrade:m.downgradeResults});
    r.done["m"+i]=1; addLog("Эффект: "+modRu(m)); commit(); },
  placestruct(){ const sh=UI.sheet; placeStructure(sh.preset.sett, sh.preset.block, sh.preset.structure); sh.result.done.place=1; commit(); },
  paystruct(){ const sh=UI.sheet, s=STR[sh.preset.structure], c=s.construction||{}; const crit = sh.result && sh.result.deg==="criticalSuccess";
    S.rp=Math.max(0,S.rp-(c.rp||0)); const parts=[`−${c.rp||0} ПР`];
    ["lumber","stone","ore","luxuries"].forEach(k=>{ if(c[k]){ const back = crit? Math.floor(c[k]/2):0; S.commodities[k]=Math.max(0,S.commodities[k]-c[k]+back); parts.push(`−${c[k]-back} ${COMM_RU[k].toLowerCase()}`); } });
    sh.result.done.pay=1; addLog(`Оплата постройки «${strName(s)}»: ${parts.join(", ")}`); commit(); },
  catalog(el){ UI.sheet={kind:"catalog",sett:el.dataset.s,block:+el.dataset.b}; renderSheet(); },
  buildroll(el){ const sh=UI.sheet, s=STR[el.dataset.id]; const c=s.construction||{};
    openAct("build-structure",{structure:s.id, sett:sh.sett, block:sh.block, dc:c.dc, skills:c.skills||[], skill:null});
    const best=(c.skills||[]).map(x=>x.skill).sort((a,b)=>skillTotal(b,{activity:"build-structure"}).total-skillTotal(a,{activity:"build-structure"}).total)[0]; if(best){ UI.sheet.skill=best; }
    UI.sheet.settlement=sh.sett; UI.sheet.dcAuto=false; renderSheet(); },
  place(el){ const sh=UI.sheet; placeStructure(sh.sett, sh.block, el.dataset.id); UI.sheet=null; commit(); renderSheet(); },
  openstruct(el){ UI.sheet={kind:"struct",id:el.dataset.id,sett:el.dataset.s,block:+el.dataset.b,ix:+el.dataset.ix}; renderSheet(); },
  demolish(){ const sh=UI.sheet, st=S.settlements.find(x=>x.id===sh.sett); const id=st.blocks[sh.block][sh.ix]; st.blocks[sh.block].splice(sh.ix,1); addLog(`${st.name}: снесено «${strName(STR[id])}»`); UI.sheet=null; commit(); renderSheet(); },
  torubble(){ const sh=UI.sheet, st=S.settlements.find(x=>x.id===sh.sett); const id=st.blocks[sh.block][sh.ix]; const lots=(STR[id]||{}).lots||1; st.blocks[sh.block].splice(sh.ix,1,...Array(lots).fill("rubble")); addLog(`${st.name}: «${strName(STR[id])}» обратилось в руины`); UI.sheet=null; commit(); renderSheet(); },
  addsett(){ const n=document.getElementById("new-sett").value.trim(); if(!n){ toast("Введите название"); return; } S.settlements.push({id:uid(),name:n,capital:!S.settlements.length,blocks:[[]],waterBorders:0}); addLog("Основано поселение "+n); commit(); },
  addblock(el){ const st=S.settlements.find(x=>x.id===el.dataset.s); const target = st.blocks.length<4?4:9; const need=target===4?3:9;
    if(S.level<need) toast(`По правилам ${target===4?"городок":"город"} требует ${need}-й уровень королевства — добавляю, но проверьте`);
    while(st.blocks.length<target) st.blocks.push([]); addLog(`${st.name} расширено до ${target} кварталов`); commit(); },
  mkcap(el){ S.settlements.forEach(x=>x.capital=x.id===el.dataset.s); commit(); },
  rensett(el){ UI.renaming=el.dataset.s; render(); },
  dorename(el){ const st=S.settlements.find(x=>x.id===el.dataset.s); st.name=document.getElementById("rename-inp").value.trim()||st.name; UI.renaming=null; commit(); },
  delsett(el){ UI.delSett=el.dataset.s; render(); }, nodel(){ UI.delSett=null; render(); },
  dodelsett(el){ const i=S.settlements.findIndex(x=>x.id===el.dataset.s); const n=S.settlements[i].name; S.settlements.splice(i,1); if(S.settlements.length && !S.settlements.some(x=>x.capital)) S.settlements[0].capital=true; UI.delSett=null; addLog("Удалено поселение "+n); commit(); },
  // turn
  dofame(){ const before=S.fame; S.fame=Math.min(3,S.fame+1+S.next.fame); let m=[`Слава ${before} → ${S.fame}`];
    if(S.next.rp){ S.rp=Math.max(0,S.rp+S.next.rp); m.push(`${fmt(S.next.rp)} ПР`); } if(S.next.rd){ S.rdTurn=S.next.rd; m.push(`${fmt(S.next.rd)} кост. ресурсов в этом ходу`); }
    S.next={rp:0,rd:0,fame:0}; S.turn.steps.fame=1; addLog(m.join(", ")); commit(); },
  doupkeepunrest(){ const u=upkeepUnrest(); let add=u.over+u.war, t=""; if(u.ruler){ const r=rnd(4); add+=r; t=` (1d4 за вакансию правителя: ${r})`; }
    const msg=changeUnrest(add); S.turn.steps.unrest=1; addLog(`Корректировка Беспорядков +${add}${t}: ${msg}`); commit(); },
  unrest10(){ const r=rnd(10), f=rnd(20); addLog(`Беспорядки ≥10: ${r} очков Развалин распределить по выбору; чистая СЛ 11: ${f} — ${f>=11?"теряете гекс на выбор":"гекс сохранён"}`); toast(`Развалины +${r} (распределите), ${f>=11?"потерян гекс":"гекс сохранён"}`); commit(); },
  docollect(){ const rd=resourceDice(); const n=Math.max(0,rd.n+(S.rdTurn||0)); let t=0,p=[]; for(let i=0;i<n;i++){ const x=rnd(rd.die); p.push(x); t+=x; } collect(t,`${n}d${rd.die}: ${p.join("+")} = ${t}`); },
  docollectmanual(){ const v=+document.getElementById("rp-manual").value; if(!(v>=0)){ toast("Впишите сумму ПР"); return; } collect(v,`свой бросок: ${v}`); },
  payfood(){ const c=consumption().total; const pay=Math.min(c,S.commodities.food); S.commodities.food-=pay; if(pay>=c) S.turn.steps.consume=1; addLog(`Потребление: −${pay} еды${pay<c?`, не хватает ${c-pay}`:""}`); commit(); },
  payrp(){ const c=consumption().total, miss=Math.max(0,c-S.commodities.food); S.commodities.food=Math.max(0,S.commodities.food-c+miss); S.rp=Math.max(0,S.rp-miss*5); S.turn.steps.consume=1; addLog(`Потребление: еда закончилась, доплачено ${miss*5} ПР`); commit(); },
  payunrest(){ const r=rnd(4); S.commodities.food=0; const m=changeUnrest(r); S.turn.steps.consume=1; addLog(`Потребление не оплачено: +${r} Беспорядков (${m})`); commit(); },
  skiptaxes(){ const r=rnd(20); let m=`Налоги не собирали: чистая СЛ 11 — ${r}`; if(r>=11) m+=", "+changeUnrest(-1); addLog(m); S.turn.steps.commerce=1; commit(); toast(r>=11?"Успех: −1 Беспорядки":"Не вышло"); },
  eventcheck(){ const dc=16-5*(S.turn.noEvent||0); const r=rnd(20); const hit=r>=dc; S.turn.eventRolled=1; S.turn.steps.event=1; S.turn.eventHappened=hit; addLog(`Проверка события СЛ ${dc}: ${r} — ${hit?"событие происходит":"событий нет"}`); toast(hit?"Событие происходит!":"В этом ходу без событий"); commit(); },
  endturn(){
    const xp=Math.min(120,S.rp); S.xp+=xp; const oldRp=S.rp; S.rp=0;
    S.mods = S.mods.filter(m=>{ if(!m.turns) return true; m.turns-=1; return m.turns>0; });
    S.turn.noEvent = S.turn.eventRolled ? (S.turn.eventHappened?0:(S.turn.noEvent||0)+1) : (S.turn.noEvent||0);
    S.turn = {n:S.turn.n+1, used:{}, taxesLast:!!S.turn.taxesThis, taxesThis:false, steps:{}, quellLast:S.turn.quellThis||"", quellThis:"", noEvent:S.turn.noEvent};
    S.rdTurn=0;
    addLog(`Ход завершён: ${oldRp} ПР → +${xp} опыта. Начат ход ${S.turn.n}.`); commit(); window.scrollTo(0,0);
  },
};
function collect(t,txt){
  const inc=income(), cap=storage(); const got=[];
  for(const c of ["lumber","ore","stone","luxuries"]){ if(inc[c]){ const b=S.commodities[c]; S.commodities[c]=Math.min(cap[c],b+inc[c]); got.push(`${COMM_RU[c].toLowerCase()} +${S.commodities[c]-b}`); } }
  S.rp+=t; S.turn.steps.collect=1; S.rdTurn=0;
  addLog(`Сбор ресурсов: ${txt} ПР${got.length?"; "+got.join(", "):""}`); commit();
}
function placeStructure(settId, bi, id){
  const st=S.settlements.find(x=>x.id===settId); if(!st) return;
  const s=STR[id], b=st.blocks[bi]; const free=4-settInfo(st).lotsOf(b);
  if((s.lots||1)>free){ toast("Не помещается в этот квартал"); return; }
  b.push(id); addLog(`${st.name}: построено «${strName(s)}»`);
  const extra=[];
  if(s.reduceUnrestBy){ const r=rollFormula(s.reduceUnrestBy.value); extra.push(changeUnrest(-r.total)); }
  if(s.reduceRuinBy && s.reduceRuinBy.ruin!=="any") extra.push(changeRuin(s.reduceRuinBy.ruin,-(+s.reduceRuinBy.value)));
  if(s.gainRuin && s.gainRuin.ruin!=="any") extra.push(changeRuin(s.gainRuin.ruin,+s.gainRuin.value));
  if((s.reduceRuinBy&&s.reduceRuinBy.ruin==="any")||(s.gainRuin&&s.gainRuin.ruin==="any")) extra.push("Развалины на выбор измените вручную на вкладке Королевство");
  if(extra.length) addLog("Эффект постройки: "+extra.join("; "));
  toast("Построено: "+strName(s));
}
function saveTab(){ try{ localStorage.setItem("km-tab",UI.tab); }catch(e){} }

document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab"); if(tab){ UI.tab=tab.dataset.tab; saveTab(); render(); window.scrollTo(0,0); return; }
  if(e.target.id==="veil"){ UI.sheet=null; renderSheet(); return; }
  const el=e.target.closest("[data-a]"); if(!el) return;
  if(el.type==="checkbox" && el.dataset.a!=="togglemod") return;
  const f=A[el.dataset.a]; if(f){ if(el.tagName==="BUTTON") e.preventDefault(); f(el); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="f-lang"){ LANG=t.value; try{localStorage.setItem("km-lang",LANG);}catch(x){} render(); return; }
  if(t.id==="f-story"){ UI.showStory=t.checked; render(); return; }
  if(t.id==="rs-sett"){ UI.sheet.settlement=t.value||null; renderSheet(); return; }
  if(t.id==="rs-dc"){ UI.sheet.dc=+t.value||0; UI.sheet.dcAuto=false; renderSheet(); return; }
  if(t.id==="rs-manual"){ UI.sheet.manual=t.value; return; }
  if(t.id==="rs-creative"){ t.checked?UI.sheet.opts.add("creative-solution"):UI.sheet.opts.delete("creative-solution"); renderSheet(); return; }
  if(t.dataset.sbind){ const [si,k]=t.dataset.sbind.split("."); S.settlements[+si][k]=+t.value; commit(); return; }
  if(t.dataset.bind){
    const p=t.dataset.bind; let v;
    if(t.type==="checkbox") v=t.checked; else if(t.dataset.num || t.type==="number") v=+t.value||0; else if(t.tagName==="SELECT" && /^skills\./.test(p)) v=+t.value; else v=t.value;
    if(p==="level") v=Math.max(1,Math.min(20,v));
    setPath(p,v); if(p==="leaders.ruler.vacant"||/\.vacant$|\.invested$/.test(p)) addLog(`${LD_RU[p.split(".")[1]]}: ${/vacant/.test(p)?(v?"роль пустует":"роль занята"):(v?"назначен":"не назначен")}`);
    commit();
  }
});
let qT=null;
document.addEventListener("input",e=>{
  if(e.target.id==="f-q"){ UI.q=e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const q=document.getElementById("f-q"); if(q){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(x){} } },200); }
  if(e.target.id==="cat-q"){ UI.catQ=e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ renderSheet(); const q=document.getElementById("cat-q"); if(q){ q.focus(); const n=q.value.length; try{q.setSelectionRange(n,n);}catch(x){} } },200); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && UI.sheet){ UI.sheet=null; renderSheet(); } });

window.KM_TEST = {get S(){return S;}, set S(v){S=normalize(v);}, controlDC, skillTotal, gatherMods, sumMods, settInfo, resourceDice, consumption, storage, degreeOf, renderRich, applyFx, changeRuin, A, UI, openAct, render};
loadLocal(); render(); setSync(); if(API) initGas(); else initDb();
})();
