"title":"Irrigation","automationNotes":"activities.irrigation.automationNotes","description":"<p>You send excavators to build waterways, canals, or drainage systems to convey water from areas that have natural access to a river or lake. Spend RP as determined by the hex’s most inhospitable terrain feature:<\/p> <ul> <li><b>Mountains<\/b>: @lose12ResourcePoints<\/li> <li><b>Swamps<\/b>: @lose8ResourcePoints<\/li> <li><b>Forests<\/b>: @lose4ResourcePoints<\/li> <li><b>Hills<\/b>: @lose2ResourcePoints<\/li> <li><b>Plains<\/b>: @lose1ResourcePoints<\/li> <\/ul> <p>Then attempt a basic check.<\/p>","requirement":"You control a hex adjacent to a river or lake that itself does not contain a river or lake.","skills":{"engineering":1},"criticalSuccess":{"msg":"<p>The hex gains a river or lake terrain feature (or you change the effects of a previous critical failure at Irrigation in this hex into a failure); work with your GM to determine where these features appear in the hex. In addition, your workers were efficient and quick, and you regain half the RP you spent building the waterways.<\/p>"},"success":{"msg":"<p>The hex gains a river or lake terrain feature (or you change the effects of a previous critical failure at Irrigation in this hex into a failure); work with your GM to determine where these features appear in the hex.<\/p>"},"failure":{"msg":"<p>You fail to build workable systems or to restore a previous critical failure, and the hex does not gain the river or lake terrain feature.<\/p>"},"criticalFailure":{"msg":"<p>You fail to build workable systems or to restore a previous critical failure, and the hex does not gain the river or lake terrain feature. Your attempts at Irrigation are so completely useless that they become breeding grounds for disease. @gain1Unrest. From this point onward, at the start of your Kingdom turn’s Event phase, attempt a @Check[type:flat|dc:4]. This flat check’s DC increases by 1 for each hex in your kingdom that contains a critically failed attempt at Irrigation. If you fail this flat check, @gain1PlagueEvent in addition to any other event it might have. You can attempt this activity again in a later Kingdom turn to undo a critically failed Irrigation attempt.<\/p>"}},{"id":"manage-trade-agreements","order":5,"oncePerRound":false,"fortune":false,"enabled":true,"phase":"commerce","dc":"control","title":"Manage Trade Agreements","description":"<p>You send agents out to attend to established trade agreements. @loseMultiple2ResourcePoints per Trade Agreement you wish to manage. Then attempt a basic check. If you Managed Trade Agreements on the previous turn, increase this DC by 5.<\/p>","skills":{"trade":0},"criticalSuccess":{"msg":"<p>@gainMultiple1ResourceDiceNextTurn per trade agreement, and 1 Commodity of your choice per trade agreement (no more than half of these Commodities may be Luxuries).<\/p>","modifiers":[{"enabled":true,"value":-5,"buttonLabel":"+5 DC Increase When Managing Trade Agreements on Next Turn","name":"Managed Trade Agreements Last Turn","type":"untyped","turns":2,"applyIf":[{"eq":["@activity","manage-trade-agreements"]}]}]},"success":{"msg":"<p>@gainMultiple1ResourceDiceNextTurn per trade agreement, or 1 Commodity of your choice per trade agreement (no more than half of these Commodities may be Luxuries).<\/p>","modifiers":[{"enabled":true,"value":-5,"buttonLabel":"+5 DC Increase When Managing Trade Agreements on Next Turn","name":"Managed Trade Agreements Last Turn","type":"untyped","turns":2,"applyIf":[{"eq":["@activity","manage-trade-agreements"]}]}]},"failure":{"msg":"<p>@gainMultiple1ResourcePointsNextTurn per trade agreement<\/p>","modifiers":[{"enabled":true,"value":-5,"buttonLabel":"+5 DC Increase When Managing Trade Agreements on Next Turn","name":"Managed Trade Agreements Last Turn","type":"untyped","turns":2,"applyIf":[{"eq":["@activity","manage-trade-agreements"]}]}]},"criticalFailure":{"msg":"<p>You gain no benefit, as your traders and merchants met with bad luck on the road. You can’t Manage Trade Agreements for 1 Kingdom turn<\/p>.","modifiers":[{"enabled":true,"value":-5,"buttonLabel":"+5 DC Increase When Managing Trade Agreements on Next Turn","name":"Managed Trade Agreements Last Turn","type":"untyped","turns":2,"applyIf":[{"eq":["@activity","manage-trade-agreements"]}]}]}},{"id":"new-leadership","oncePerRound":false,"fortune":false,"enabled":true,"order":2,"phase":"upkeep","dc":"control","title":"New Leadership","description":"<p>You announce the promotion of a character into a leadership role, whether they’re a newly appointed leader or just shifting from one leadership role to another. You normally perform this activity at the start of a Kingdom turn, but if unexpected events (such as the death of the character) remove a leader from a leadership role, you may immediately use the New Leadership activity to attempt to assign a new leader to that role, even outside of a Kingdom turn (applying the vacancy penalty for that role as appropriate). Attempt a basic Intrigue, Politics, Statecraft, or Warfare skill check—while any of these skills can be used, each skill is particularly suited to assigning two specific leadership roles.<\/p><ul><li><b>Intrigue<\/b>: Grants a +2 circumstance bonus to checks to assign Emissaries and Treasurers.<\/li><li><b>Politics<\/b>: Grants a +2 circumstance bonus to checks to assign Counselors and Rulers.<\/li><li><b>Statecraft<\/b>: Grants a +2 circumstance bonus to checks to assign Magisters and Viceroys.<\/li><li><b>Warfare<\/b>: Grants a +2 circumstance bonus to checks to assign Generals and Wardens.<\/li><\/ul><p>Rulers are particularly difficult to assign; when you take this activity to assign a new Ruler, you take a –4 circumstance penalty to the skill check, and unless you achieve a critical success, you @gain1Unrest.<\/p><p>Whether or not you are simultaneously assigning a leader, you may also use this activity to attempt to reselect the four leadership roles that you have invested. Any result other than a critical failure allows this.<\/p>","defaultToBestSkill":true,"modifiers":[{"type":"circumstance","value":2,"enabled":false,"buttonLabel":"activities.new-leadership.modifiers.matchingSkillBonus.buttonLabel","name":"+2 Circumstance When Using Correct Skill"},{"type":"circumstance","value":-4,"enabled":false,"buttonLabel":"activities.new-leadership.modifiers.appointingRulerPenalty.buttonLabel","name":"-4 Circumstance When Appointing Ruler"}],"skills":{"intrigue":0,"politics":0,"statecraft":0,"warfare":0},"criticalSuccess":{"msg":"<p>The people love the new leader. The leader immediately provides the benefits tied to occupying the new role and gains a +1 circumstance bonus to all Kingdom skill checks they attempt before the end of the next Kingdom turn.<\/p>","modifiers":[{"turns":2,"enabled":false,"value":1,"buttonLabel":"+1 Circumstance to All Checks","name":"New Leadership: Critical Success","type":"circumstance"}]},"success":{"msg":"<p>The people accept the new leader. The leader immediately provides the benefits tied to occupying the new role. @gain1Unrest<\/p>"},"failure":{"msg":"<p>The people are unsure about the new leader. The leader takes a –1 circumstance penalty to all checks they attempt as part of their activities during the Activity phase of each Kingdom turn. At the end of the next Kingdom turn, the leader can attempt any Loyalty-based basic skill check to ingratiate themselves with the populace. The leader may attempt this check at the end of each Kingdom turn until they succeed. Success removes this penalty, but a critical failure results in the development detailed in Critical Failure below. @gain1Unrest<\/p>","modifiers":[{"enabled":false,"buttonLabel":"-1 Circumstance to All Checks","name":"New Leadership: Failure","value":-1,"type":"circumstance","applyIf":[{"in":["@phase",["leadership","army","region","civic"]]}]}]},"criticalFailure":{"msg":"<p>The people reject the new leader. The leadership role is treated as vacant and you must attempt to reassign it using the New Leadership activity at the start of the next Kingdom turn. @gain1Unrest<\/p>"}},{"id":"offensive-gambit","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"scouting","title":"Offensive Gambit","description":"<p>You order an attack against an enemy army, causing a war encounter to begin after this Kingdom turn ends. No check is necessary if you wish to engage the enemy without attempting to gain an advantage in initiative. If you want to gain an advantage by surprising the enemy, attempt an Intrigue check. If you want to gain an advantage by intimidating the enemy, attempt a Warfare check. In either case, the DC is equal to the enemy army’s Scouting DC.<\/p>","requirement":"You have at least one army in the same hex as an enemy army.","skills":{"intrigue":0},"criticalSuccess":{"msg":"<p>Your approach surprises or intimidates the enemy. Your armies in this hex gain a +2 circumstance bonus on their initiative checks, and one enemy army of the party’s choice in this hex becomes shaken 1.<\/p>"},"success":{"msg":"<p>Your approach gives you an advantage. Your armies in this hex gain a +2 circumstance bonus on their initiative checks.<\/p>"},"failure":{"msg":"<p>You gain no advantage in the battle.<\/p>"},"criticalFailure":{"msg":"<p>Not only do you fail to gain advantage, but the enemy forces have anticipated the attack. Enemy armies in this hex at the time of the Offensive<\/p>"}},{"id":"outfit-army","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Outfit Army","description":"<p>You provide your army with better gear. Choose what sort of gear you wish to provide your army with from the list. The level of the gear chosen must be equal to or less than the army’s level. If you’re crafting or purchasing gear, the level of the gear chosen must be equal to or less than your kingdom level. If you’re distributing resources gained from battle, the level of the gear chosen must be equal to or less than the highest level of an enemy army defeated in that battle. If you’re purchasing the gear, this activity requires a basic Trade check and costs the standard amount of RP for the gear; you cannot purchase magic gear unless your kingdom is at least expert rank in Magic. If you’re distributing gear gained from battle, this activity requires a basic Warfare check and does not cost RP.<\/p>","skills":{"trade":0,"warfare":0},"criticalSuccess":{"msg":"<p>The gear proved particularly easy to outfit, and the army becomes efficient.<\/p>"},"success":{"msg":"<p>The gear is sufficient, and your army becomes outfitted with it immediately.<\/p>"},"failure":{"msg":"<p>The gear proves to be unusable and the attempt to outfit the army fails. If you spent RP on the check, it is refunded.<\/p>"},"criticalFailure":{"msg":"<p>The gear proves to be unusable and the attempt to outfit the army fails.<\/p>"}},{"id":"pledge-of-fealty","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"negotiation","title":"Pledge of Fealty","description":"<p>When your representatives encounter freeholders, refugees, independent groups, or other bands of individuals gathered in the wilderness who aren’t already part of a nation, you can offer them a place in your kingdom, granting them the benefits of protection, security, and prosperity in exchange for their fealty. The benefits granted to your kingdom can vary wildly, but often manifest as one-time boons to your commodities or unique bonuses against certain types of events. The adventure text in this campaign offers numerous examples of groups who could accept a Pledge of Fealty. You can attempt this skill check with Intrigue, Statecraft, or Warfare; however, certain groups will respond better (or worse) to specific skills. The DC is the group’s Negotiation DC.<\/p>","defaultToBestSkill":true,"skills":{"intrigue":1,"statecraft":1,"warfare":1},"criticalSuccess":{"msg":"<p>The group becomes part of your kingdom, granting the specific boon or advantage listed in that group’s entry. If you haven’t already claimed the hex in which the group dwells, you immediately do so, gain 10XP and increasing your kingdom's Size by 1. If the hex doesn’t share a border with your kingdom, it becomes a secondary territory and checks involving this location take a Control penalty.<\/p>"},"success":{"msg":"<p>The group becomes part of your kingdom, granting the specific boon or advantage listed in that group’s entry. If the hex doesn’t share a border with your kingdom, it becomes a secondary territory and checks involving this location take a Control penalty. @lose1RolledResourceDice to the result to integrate the group into your kingdom.<\/p>"},"failure":{"msg":"<p>The group refuses to pledge to you at this time. You can attempt to get them to Pledge Fealty next turn. @gain1Unrest<\/p>"},"criticalFailure":{"msg":"<p>The group refuses to pledge to you—furthermore, it will never Pledge Fealty to your kingdom, barring significant in-play changes or actions by the PCs (subject to the GM’s approval). The group’s potentially violent rebuff of your offer @gain2Unrest and increases a Ruin of your choice by 1<\/p> <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"preventative-measures","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Preventative Measures","description":"<p>You help to organize magical defenses and resources to combat potential upcoming disasters or dangers to the kingdom. Attempt a basic Magic check to determine how effective the magical preparations are.<\/p>","automationNotes":"activities.preventative-measures.automationNotes","skills":{"magic":0},"criticalSuccess":{"msg":"<p>The next time during this Kingdom turn that you attempt a Kingdom skill check to resolve a dangerous event, you gain a +2 circumstance bonus to the check and, unless you roll a critical failure, the result is improved one degree. If you reach the end of this Kingdom turn and haven’t had a dangerous event, you may decrease one Ruin of your choice by 1<\/p> <ul><li>@lose1Corruption<\/li><li>@lose1Crime<\/li><li>@lose1Decay<\/li><li>@lose1Strife<\/li><\/ul>","modifiers":[{"turns":1,"buttonLabel":"+2 Circumstance To Resolve Dangerous Event and Improve Degree","name":"Preventative Measures: Critical Success","isConsumedAfterRoll":true,"applyIf":[{"in":["dangerous","@eventTraits"]}],"enabled":false,"value":2,"type":"circumstance","upgradeResults":[{"upgrade":"failure"},{"upgrade":"success"}]}]},"success":{"msg":"<p>The next time during this Kingdom turn that you attempt a Kingdom skill check to resolve a dangerous event, you gain a +2 circumstance bonus to the check.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+2 Circumstance to Resolve Dangerous Event","name":"+2 Circumstance to Resolve Dangerous Event","isConsumedAfterRoll":true,"applyIf":[{"in":["dangerous","@eventTraits"]}],"enabled":false,"value":2,"type":"circumstance"}]},"criticalFailure":{"msg":"<p>The attempt to put preventative measures in place has resulted in significant waste of resources. You can’t use Preventative Measures again on your next Kingdom turn, and @lose2ResourceDiceNextTurn<\/p>"}},{"id":"process-hidden-fees","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Process Hidden Fees","automationNotes":"activities.process-hidden-fees.automationNotes","description":"<p>With your aid, you can process additional taxes, fees, and payments. Attempt a basic Trade check to determine what sorts of additional resources you gather.<\/p>","skills":{"trade":0},"criticalSuccess":{"msg":"<p>@gain2ResourceDiceNextTurn<\/p>"},"success":{"msg":"<p>@gain1ResourceDiceNextTurn, but the citizens suspect something is going on: if you attempt to Process Hidden Fees on the next Kingdom turn, the result is worsened one degree.<\/p>","modifiers":[{"name":"Processed Hidden Fees on the Previous turn","buttonLabel":"Worsen Degree of Success when processing hidden fees next turn","downgradeResults":[{"downgrade":"criticalSuccess"},{"downgrade":"success"},{"downgrade":"failure"}],"turns":2,"applyIf":[{"eq":["@activity","process-hidden-fees"]}],"value":0,"type":"untyped","enabled":true}]},"failure":{"msg":"<p>@gain1ResourceDiceNextTurn, but the citizens catch wind of the fees and grow unhappy. @gain1Unrest, and you cannot Process Hidden Fees on your next Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>@gain1ResourceDiceNextTurn, but the citizens catch wind of the fees and grow unhappy. @gain1d6Unrest, and you cannot Process Hidden Fees on your next Kingdom turn.<\/p>"}},{"id":"prognostication","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Prognostication","description":"<p>Your kingdom’s spellcasters read the omens and provide advice on how best to prepare for near-future events. Attempt a basic check.<\/p>","skills":{"magic":1},"criticalSuccess":{"msg":"<p>If you have a random kingdom event this turn, roll twice to determine the event that takes place. The players choose which of the two results occurs, and the kingdom gains a +2 circumstance bonus to the check to resolve the event.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+2 Circumstance to Resolve Event","name":"Prognostication: Critical Success","isConsumedAfterRoll":true,"applyIf":[{"eq":["@phase","event"]}],"enabled":true,"value":2,"type":"circumstance"}]},"success":{"msg":"<p>Gain a +1 circumstance bonus to checks made to resolve random kingdom events this turn.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+1 Circumstance to Resolve Event","name":"Prognostication: Success","applyIf":[{"eq":["@phase","event"]}],"enabled":true,"value":1,"type":"circumstance"}]},"failure":{"msg":"<p>Your spellcasters divine no aid.<\/p>"},"criticalFailure":{"msg":"<p>Your spellcasters provide inaccurate readings of the future. You automatically have a random kingdom event this turn. Roll twice to determine the event that takes place; the GM decides which of the two results occurs.<\/p>"}},{"id":"provide-care","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Provide Care","description":"<p>Attempt a basic check to organize and encourage your settlements’ healers, apothecaries, medics, and other caregivers to provide care and support for citizens in need.<\/p>","skills":{"defense":0},"criticalSuccess":{"msg":"<p>You provide unexpectedly compassionate support for the people. @lose1Unrest and reduce one Ruin of your choice by 1<\/p> <ul><li>@lose1Corruption<\/li><li>@lose1Crime<\/li><li>@lose1Decay<\/li><li>@lose1Strife<\/li><\/ul>"},"success":{"msg":"<p>Your care soothes the worries and fears of the populace; @lose1Unrest.<\/p>"},"failure":{"msg":"<p>You don’t provide any notable care for the citizens, but at least you don’t make things worse.<\/p>"},"criticalFailure":{"msg":"<p>Your attempt to provide care backfires. @gain1Unrest or a Ruin of your choice by 1<\/p><ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"purchase-commodities","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Purchase Commodities","description":"<p>You can spend RP to Purchase Commodities, but doing so is more expensive than gathering them or relying upon trade agreements. When you Purchase Commodities, select the Commodity you wish to purchase (Food, Lumber, Luxuries, Ore, or Stone). @lose8ResourcePoints if you’re purchasing Luxuries or @lose4ResourcePoints if you’re purchasing any other Commodity. Then attempt a basic check.<\/p>","skills":{"trade":0},"criticalSuccess":{"msg":"<p>You immediately gain 4 Commodities of the chosen type:<\/p> <ul><li>@gain4Food<\/li><li>@gain4Ore<\/li><li>@gain4Lumber<\/li><li>@gain4Stone<\/li><li>@gain4Luxuries<\/li><\/ul><p>and 2 Commodities of any other type (except Luxuries):<\/p> <ul><li>@gain2Food<\/li><li>@gain2Ore<\/li><li>@gain2Lumber<\/li><li>@gain2Stone<\/li><\/ul>"},"success":{"msg":"<p>You gain 2 Commodities of the chosen type.<p> <ul><li>@gain2Food<\/li><li>@gain2Ore<\/li><li>@gain2Lumber<\/li><li>@gain2Stone<\/li><li>@gain2Luxuries<\/li><\/ul>"},"failure":{"msg":"<p>You gain 1 Commodity of the chosen type.<\/p> <ul><li>@gain1Food<\/li><li>@gain1Ore<\/li><li>@gain1Lumber<\/li><li>@gain1Stone<\/li><li>@gain1Luxuries<\/li><\/ul>"},"criticalFailure":{"msg":"<p>Failure You gain no Commodities.<\/p>"}},{"id":"quell-unrest","oncePerRound":true,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Quell Unrest","description":"<p>You send your agents among the citizenry with the charge of suppressing dissent and calming unrest. You can attempt a basic Arts, Folklore, Intrigue, Magic, Politics, or Warfare check to Quell Unrest, but you can never use the same skill for this activity in consecutive Kingdom turns. This activity cannot be attempted more than once per Kingdom turn.<\/p>","defaultToBestSkill":true,"skills":{"arts":0,"folklore":0,"intrigue":0,"magic":0,"politics":0,"warfare":0},"criticalSuccess":{"msg":"<p>@lose1d6Unrest<\/p>"},"success":{"msg":"<p>@lose1Unrest<\/p>"},"failure":{"msg":"<p>You fail to reduce Unrest.<\/p>"},"criticalFailure":{"msg":"<p>You not only fail to reduce Unrest, but actually incite further anger among the citizenry. Choose one of the following: @gain1d4Unrest or increase two Ruins of your choice by 1<\/p><ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"read-all-about-it","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Read All About It","description":"<p>You take advantage of your nation’s paper to print an extra edition, a bonus-sized issue, or something to spread news to the citizens of the nation so that they are more prepared for upcoming events or more informed on how to deal with ongoing events. Attempt a basic Scholarship check to determine how helpful the information proves to be.<\/p>","requirement":"You have built a Printing House","skills":{"scholarship":0},"criticalSuccess":{"msg":"<p>Your kingdom becomes particularly prepared. The next time you attempt a skill check to resolve any event during this Kingdom turn, you gain a +4 circumstance bonus to the roll.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+4 Circumstance to Resolve Event","name":"Read All About It: Critical Success","isConsumedAfterRoll":true,"applyIf":[{"eq":["@phase","event"]}],"enabled":true,"value":4,"type":"circumstance"}]},"success":{"msg":"<p>The information is helpful, but only against ongoing events. The next time you attempt a skill check to resolve an ongoing event during this Kingdom turn, you gain a +2 circumstance bonus to the roll.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+2 Circumstance to Ongoing Event","name":"Read All About It: Success","isConsumedAfterRoll":true,"applyIf":[{"in":["continuous","@eventTraits"]}],"enabled":false,"value":2,"type":"circumstance"}]},"failure":{"msg":"<p>You fail to prepare your people for the worst.<\/p>"},"criticalFailure":{"msg":"<p>Critical parts of the information you published are false. You take a –2 circumstance penalty to all skill checks made to resolve Kingdom events for the remainder of this Kingdom turn<\/p>","modifiers":[{"buttonLabel":"-2 Circumstance to Events","name":"Read All About It: Critical Failure","turns":1,"applyIf":[{"eq":["@phase","event"]}],"enabled":true,"value":-2,"type":"circumstance"}]}},{"id":"recover-army-damaged","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Recover Army: Damaged","description":"<p>When an army endures ill fortune, it can become afflicted by negative conditions. You can use the Recover Army activity to work at removing an affliction with a basic skill check.<\/p>","defaultToBestSkill":true,"skills":{"defense":0,"folklore":2},"criticalSuccess":{"msg":"<p>You increase its HP by 2 up to its maximum.<\/p>"},"success":{"msg":"<p>You increase its HP by 1 up to its maximum.<\/p>"},"failure":{"msg":"<p>You fail to remove the affliction. <\/p>"},"criticalFailure":{"msg":"<p>You fail to remove the affliction and your soldier’s lowered morale spreads discontent; @gain1Unrest.<\/p>"}},{"id":"recover-army-defeated","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","dcAdjustment":5,"title":"Recover Army: Defeated","description":"<p>When an army endures ill fortune, it can become afflicted by negative conditions. You can use the Recover Army activity to work at removing an affliction with a basic skill check. The DC is increased by 5.<\/p>","defaultToBestSkill":true,"skills":{"politics":3,"warfare":2},"criticalSuccess":{"msg":"<p>You increase its HP by 2 up to its maximum and remove the affliction.<\/p>"},"success":{"msg":"<p>You increase its HP by 1 up to its maximum and remove the affliction.<\/p>"},"failure":{"msg":"<p>You fail to remove the affliction.<\/p>"},"criticalFailure":{"msg":"<p>You fail to remove the affliction and your soldier’s lowered morale spreads discontent; @gain1Unrest. The army is destroyed.<\/p>"}},{"id":"recover-army-lost","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Recover Army: Lost","description":"<p>When an army endures ill fortune, it can become afflicted by negative conditions. You can use the Recover Army activity to work at removing an affliction with a basic skill check.<\/p>","defaultToBestSkill":true,"skills":{"exploration":0,"wilderness":2},"criticalSuccess":{"msg":"<p>You remove the affliction.<\/p>"},"success":{"msg":"<p>You remove the affliction.<\/p>"},"failure":{"msg":"<p>You fail to remove the affliction.<\/p>"},"criticalFailure":{"msg":"<p>You fail to remove the affliction and your soldier’s lowered morale spreads discontent; @gain1Unrest.<\/p>"}},{"id":"recover-army-mired-pinned","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Recover Army: Mired or Pinned","description":"<p>When an army endures ill fortune, it can become afflicted by negative conditions. You can use the Recover Army activity to work at removing an affliction with a basic skill check.<\/p>","defaultToBestSkill":true,"skills":{"engineering":0,"magic":2},"criticalSuccess":{"msg":"<p>You reduce the affliction’s value by 2. If the affliction does not have a value, it is removed.<\/p>"},"success":{"msg":"<p>As critical success but you reduce the affliction’s value by 1.<\/p>"},"failure":{"msg":"<p>You fail to remove the affliction.<\/p>"},"criticalFailure":{"msg":"<p>You fail to remove the affliction and your soldier’s lowered morale spreads discontent; @gain1Unrest.<\/p>"}},{"id":"recover-army-shaken","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Recover Army: Shaken","description":"<p>When an army endures ill fortune, it can become afflicted by negative conditions. You can use the Recover Army activity to work at removing an affliction with a basic skill check.<\/p>","defaultToBestSkill":true,"skills":{"arts":0,"warfare":2},"criticalSuccess":{"msg":"<p>You reduce the affliction’s value by 2.<\/p>"},"success":{"msg":"<p>You reduce the affliction’s value by 1.<\/p>"},"failure":{"msg":"<p>You fail to remove the affliction.<\/p>"},"criticalFailure":{"msg":"<p>You fail to remove the affliction and your soldier’s lowered morale spreads discontent; @gain1Unrest.<\/p>"}},{"id":"recover-army-weary","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Recover Army: Weary","description":"<p>When an army endures ill fortune, it can become afflicted by negative conditions. You can use the Recover Army activity to work at removing an affliction with a basic skill check.<\/p>","defaultToBestSkill":true,"skills":{"defense":0,"arts":2},"criticalSuccess":{"msg":"<p>You reduce the affliction’s value by 2.<\/p>"},"success":{"msg":"<p>You reduce the affliction’s value by 1.<\/p>"},"failure":{"msg":"<p>You fail to remove the affliction.<\/p>"},"criticalFailure":{"msg":"<p>You fail to remove the affliction and your soldier’s lowered morale spreads discontent; @gain1Unrest.<\/p>"}},{"id":"recruit-army","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"custom","title":"Recruit Army","description":"<p>Either you recruit an army from your kingdom’s citizens, or you secure the allegiance of a specialized army you encountered. If you’re recruiting an army from your kingdom’s citizens, choose one of the basic armies listed at the start of page 570 and attempt a Warfare check against the army’s Recruitment DC. If you’re securing a specialized army, you must attempt a Statecraft check against the Recruitment DC;<\/p>","skills":{"warfare":0,"statecraft":0},"criticalSuccess":{"msg":"<p>You recruit the army; it becomes efficient.<\/p>"},"success":{"msg":"<p>You recruit the army.<\/p>"},"failure":{"msg":"<p>You fail to recruit the army.<\/p>"},"criticalFailure":{"msg":"<p>Many of the individuals in the army you attempted to recruit took offense at the attempt. @gain1Unrest, and you cannot attempt to recruit an army again until the next Kingdom turn.<\/p>"}},{"id":"recruit-monsters","oncePerRound":false,"fortune":true,"enabled":false,"phase":"region","dc":"control","title":"Recruit Monsters","description":"<p>While you are quick to suggest that most of the monsters the party encounters during their adventures deserve killing, you also understands that there can be exceptions. Some can be bribed or allied with, while others can be trusted to act on their instincts—a canny person can capitalize on these instincts or alliances to bolster a kingdom’s defenses. Attempt a basic Intrigue check.<\/p>","skills":{"intrigue":0},"criticalSuccess":{"msg":"<p>You manage to locate a monster’s lair and take steps to incorporate it into your kingdom’s defense. The next time your kingdom suffers a Bandit Activity, Monster Activity, Sacrifices, or Undead Uprising random event, you can use your recruited monster to help resolve the event. Doing so removes the Recruited Monster from your kingdom (you can attempt to recruit a new monster on a future kingdom turn though) but allows you to roll a skill check twice when resolving the Dangerous Hex event, taking the better of the two results as your actual result. This is a fortune effect. Your kingdom can support 1 Recruited Monster at a time. If your kingdom is master in Intrigue, you can support up to 2 Recruited Monsters at a time, and if your kingdom is legendary in Intrigue, you can support up to 3 Recruited Monsters at a time.<\/p>","modifiers":[{"type":"untyped","name":"Use Recruited Monster to resolve Bandit Activity, Monster Activity, Sacrifices, or Undead Uprising","buttonLabel":"Gain A Monster","isConsumedAfterRoll":true,"enabled":false,"rollTwiceKeepHighest":true,"fortune":true,"applyIf":[{"in":["dangerous","@eventTraits"]},{"in":["hex","@eventTraits"]}],"value":0}]},"success":{"msg":"<p>You locate a monster’s lair but can’t recruit it into your kingdom’s defense just yet. If you attempt this activity on your next kingdom turn; the result of that check is improved one degree as you continue to build a rapport with the monster.<\/p>","modifiers":[{"type":"untyped","name":"Recruit befriended monster","buttonLabel":"Upgrade Degree to Recruit Monster Next Turn","isConsumedAfterRoll":true,"enabled":false,"upgradeResults":[{"upgrade":"criticalFailure"},{"upgrade":"failure"},{"upgrade":"success"}],"turns":2,"applyIf":[{"eq":["@activity","recruit-monsters"]}],"value":0}]},"failure":{"msg":"<p>You fail to locate a monster, or if you were recruiting a monster you didn’t succeed at recruiting on the previous turn, that monster moves on and you must start the recruitment procedure from scratch in the future.<\/p>"},"criticalFailure":{"msg":"<p>You found a monster, but it proves impossible to recruit. Worse, you’ve attracted its attention. @gain1MonsterActivityEvent in addition to any other potential random events.<\/p>"}},{"id":"relocate-capital","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","dcAdjustment":5,"title":"Relocate Capital","requirement":"One of your settlements that is not your current capital must contain a Castle, Palace, or Town Hall. All leaders must spend all of their leadership activities during the Activity phase of a Kingdom turn on this activity.","description":"<p>The kingdom leaders announce that they are uprooting the seat of government from its current home and reestablishing it in another settlement. Attempt a check with a DC equal to the kingdom’s Control DC + 5. You cannot Relocate your Capital again for at least 3 Kingdom turns.<\/p>","automationNotes":"activities.relocate-capital.automationNotes","skills":{"industry":1},"criticalSuccess":{"msg":"<p>The move goes off splendidly, with people excited about the new capital and celebrating the leadership’s wisdom.<\/p>"},"success":{"msg":"<p>The move goes smoothly and with minimal disruption, but some folks are upset or homesick. @gain1Unrest<\/p>"},"failure":{"msg":"<p>The move causes unhappiness. @gain1Unrest and increase two Ruins of your choice by 1<\/p> <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"},"criticalFailure":{"msg":"<p>The people reject the idea of the new capital and demand you move it back. The move is unsuccessful, and your capital remains unchanged. @gain1d4Unrest. Increase three Ruins of your choice by 1 and the fourth Ruin by 3<\/p><ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"repair-reputation-corruption","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","dcAdjustment":2,"title":"Repair Reputation: Corruption","description":"<p>When things have gotten out of hand in the kingdom and the nation’s reputation has become damaged, you can focus efforts on a campaign to reassure the citizens and bring them closer together, stamp down crime, organize repairs and maintenance of public structures, or strive to adjust poor public opinions.<\/p><p>The skill used to Repair Reputation depends on which Ruin total you wish to reduce. If you wish to reduce your Corruption, you attempt an Arts check. If you wish to reduce your Crime, you attempt a Trade check. If you wish to reduce your Decay, you attempt an Engineering check. If you wish to reduce your Strife, you attempt an Intrigue check. In all cases, the DC is your Control DC + 2.<\/p>","automationNotes":"activities.repair-reputation-crime.automationNotes","skills":{"arts":1},"criticalSuccess":{"msg":"<p>@lose2Corruption and reduce its current ruin penalty by 1 to a minimum of 0.<\/p>"},"success":{"msg":"<p>@lose1Corruption<\/p>"},"failure":{"msg":"<p>You fail to reduce the targeted Ruin. You cannot attempt to Repair Reputation on this Ruin for 1 Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>You fail to reduce the targeted Ruin in a particularly public and embarrassing way. @gain1d4Unrest, and you cannot attempt to Repair Reputation for 3 Kingdom turns.<\/p>"}},{"id":"repair-reputation-crime","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","dcAdjustment":2,"title":"Repair Reputation: Crime","description":"<p>When things have gotten out of hand in the kingdom and the nation’s reputation has become damaged, you can focus efforts on a campaign to reassure the citizens and bring them closer together, stamp down crime, organize repairs and maintenance of public structures, or strive to adjust poor public opinions. <\/p><p>The skill used to Repair Reputation depends on which Ruin total you wish to reduce. If you wish to reduce your Corruption, you attempt an Arts check. If you wish to reduce your Crime, you attempt a Trade check. If you wish to reduce your Decay, you attempt an Engineering check. If you wish to reduce your Strife, you attempt an Intrigue check. In all cases, the DC is your Control DC + 2.<\/p>","automationNotes":"activities.repair-reputation-crime.automationNotes","skills":{"trade":1},"criticalSuccess":{"msg":"<p>@lose2Crime and reduce its current ruin penalty by 1 to a minimum of 0.<\/p>"},"success":{"msg":"<p>@lose1Crime<\/p>"},"failure":{"msg":"<p>You fail to reduce the targeted Ruin. You cannot attempt to Repair Reputation on this Ruin for 1 Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>You fail to reduce the targeted Ruin in a particularly public and embarrassing way. @gain1d4Unrest, and you cannot attempt to Repair Reputation for 3 Kingdom turns.<\/p>"}},{"id":"repair-reputation-decay","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","dcAdjustment":2,"title":"Repair Reputation: Decay","description":"<p>When things have gotten out of hand in the kingdom and the nation’s reputation has become damaged, you can focus efforts on a campaign to reassure the citizens and bring them closer together, stamp down crime, organize repairs and maintenance of public structures, or strive to adjust poor public opinions. <\/p><p>The skill used to Repair Reputation depends on which Ruin total you wish to reduce. If you wish to reduce your Corruption, you attempt an Arts check. If you wish to reduce your Crime, you attempt a Trade check. If you wish to reduce your Decay, you attempt an Engineering check. If you wish to reduce your Strife, you attempt an Intrigue check. In all cases, the DC is your Control DC + 2.<\/p>","automationNotes":"activities.repair-reputation-crime.automationNotes","skills":{"engineering":1},"criticalSuccess":{"msg":"<p>@lose2Decay and reduce its current ruin penalty by 1 to a minimum of 0.<\/p>"},"success":{"msg":"<p>@lose1Decay<\/p>"},"failure":{"msg":"<p>You fail to reduce the targeted Ruin. You cannot attempt to Repair Reputation on this Ruin for 1 Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>You fail to reduce the targeted Ruin in a particularly public and embarrassing way. @gain1d4Unrest, and you cannot attempt to Repair Reputation for 3 Kingdom turns.<\/p>"}},{"id":"repair-reputation-strife","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","dcAdjustment":2,"title":"Repair Reputation: Strife","description":"<p>When things have gotten out of hand in the kingdom and the nation’s reputation has become damaged, you can focus efforts on a campaign to reassure the citizens and bring them closer together, stamp down crime, organize repairs and maintenance of public structures, or strive to adjust poor public opinions.<\/p><p>The skill used to Repair Reputation depends on which Ruin total you wish to reduce. If you wish to reduce your Corruption, you attempt an Arts check. If you wish to reduce your Crime, you attempt a Trade check. If you wish to reduce your Decay, you attempt an Engineering check. If you wish to reduce your Strife, you attempt an Intrigue check. In all cases, the DC is your Control DC + 2.<\/p>","automationNotes":"activities.repair-reputation-crime.automationNotes","skills":{"intrigue":1},"criticalSuccess":{"msg":"<p>@lose2Strife and reduce its current ruin penalty by 1 to a minimum of 0.<\/p>"},"success":{"msg":"<p>@lose1Strife<\/p>"},"failure":{"msg":"<p>You fail to reduce the targeted Ruin. You cannot attempt to Repair Reputation on this Ruin for 1 Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>You fail to reduce the targeted Ruin in a particularly public and embarrassing way. @gain1d4Unrest, and you cannot attempt to Repair Reputation for 3 Kingdom turns.<\/p>"}},{"id":"repair-the-flooded-mine","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":32,"title":"Repair the Flooded Mine","description":"<p>A group of engineers work to drain the flooded mine, shore up its damaged section, and establish the mine as a functional Work Site. @lose20ResourcePoints, then attempt a DC 32 Engineering check.<\/p>","skills":{"engineering":3},"criticalSuccess":{"msg":"<p>The mine is repaired, and as a bonus, your workers Establish a Work Site at the mine immediately. This mine produces 2 Ore Commodities per Kingdom turn.<\/p>"},"success":{"msg":"<p>The mine is repaired. This mine produces 2 Ore Commodities per Kingdom turn.<\/p>"},"failure":{"msg":"<p>Work on repairing the mine proceeds, but at a much slower (and more expensive) pace than you’d hoped. The mine remains flooded, but you can attempt this check again on the next Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>Work on repairing the mine proceeds, but at a much slower (and more expensive) pace than you’d hoped. The mine remains flooded, but you can attempt this check again on the next Kingdom turn. In addition, a catastrophic failure costs the lives of several workers. @gain2Unrest and @gain1Decay. The next time you attempt to Repair the Flooded Mine, it costs 40 RP.<\/p>"}},{"id":"request-foreign-aid","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"negotiation","dcAdjustment":2,"title":"Request Foreign Aid","description":"<p>When disaster strikes, you send out a call for help to another nation with whom you have diplomatic relations. The DC of this check is equal to the other group’s Negotiation DC +2 (see the sidebar on page 519).<\/p>","requirement":"You have diplomatic relations with the group you are requesting aid from.","automationNotes":"activities.request-foreign-aid.automationNotes","skills":{"statecraft":1},"criticalSuccess":{"msg":"<p>Your ally’s aid grants a +4 circumstance bonus to any one Kingdom skill check attempted during the remainder of this Kingdom turn. You can choose to apply this bonus to any Kingdom skill check after the die is rolled, but must do so before the result is known. In addition, @gain2RolledResourceDice; this RP does not accrue into XP at the end of the turn if you don’t spend it.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+4 Circumstance to Any Check","name":"Request Foreign Aid: Critical Success","isConsumedAfterRoll":true,"enabled":false,"value":4,"type":"circumstance"}]},"success":{"msg":"<p>Your ally’s aid grants you either a +2 circumstance bonus to any one Kingdom skill check attempted during the remainder of this Kingdom turn or @gain1RolledResourceDice. This RP does not accrue into XP at the end of the turn if you don’t spend it. You can choose to apply the bonus to any Kingdom skill check after the die is rolled, but must do so before the result is known.<\/p>","modifiers":[{"turns":1,"isConsumedAfterRoll":true,"buttonLabel":"+2 Circumstance to Any Check","name":"Request Foreign Aid: Success","enabled":false,"value":2,"type":"circumstance"}]},"failure":{"msg":"<p>Your ally marshals its resources but cannot get aid to you in time to deal with your current situation. @gain1d4ResourcePointsNextTurn<\/p>"},"criticalFailure":{"msg":"<p>Your ally is tangled up in its own problems and is unable to assist you, is insulted by your request for aid, or might even have an interest in seeing your kingdom struggle against one of your ongoing events. Whatever the case, your pleas for aid make your kingdom look desperate. You gain no aid, but you do @gain1d4Unrest.<\/p>"}},{"id":"rest-and-relax","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"control","title":"Rest and Relax","description":"<p>Working non-stop can burn out even the most devoted and dedicated individual. As such, it’s important to take time for yourself, and thus set a good example for the nation.<\/p><p>You take time to relax, and you extend the chance to unwind to your citizens as well. The Kingdom skill you use to determine the effectiveness of your time off depends on how you want to spend it: Use a basic Arts check to spend the time engaged in entertainment or the pursuit of a hobby. Use a basic Boating check to enjoy trips on the lakes and rivers of your kingdom. Use a basic Scholarship check to spend the time reading or studying a topic of personal interest beyond your daily duties. Use a basic Trade check to spend your time shopping or feasting. Use a basic Wilderness check to get away from the bustle and relax in the countryside. If your kingdom Rested and Relaxed the previous Kingdom turn, the DC increases by 4, as your kingdom’s production and output hasn’t had a chance to catch up to all those vacation days.<\/p>","defaultToBestSkill":true,"skills":{"arts":0,"boating":0,"scholarship":0,"trade":0,"wilderness":0},"criticalSuccess":{"msg":"<p>The citizens enjoy the time off and are ready to get back to work. @lose1Unrest, and the next Leadership activity you take gains a +2 circumstance bonus.<\/p>","modifiers":[{"turns":1,"isConsumedAfterRoll":true,"name":"Rest and Relax: Critical Success","buttonLabel":"+2 Circumstance to Next Leadership Activity","applyIf":[{"eq":["@phase","leadership"]}],"enabled":true,"value":2,"type":"circumstance"},{"name":"Rest and Relax performed last turn","buttonLabel":"+4 DC increase if Rest and Relax performed next turn","turns":2,"applyIf":[{"eq":["@activity","rest-and-relax"]}],"value":-4,"type":"untyped","enabled":true}]},"success":{"msg":"<p>The time spent relaxing has calmed nerves; @lose1Unrest.<\/p>","modifiers":[{"name":"Rest and Relax performed last turn","buttonLabel":"+4 DC increase if Rest and Relax performed next turn","turns":2,"applyIf":[{"eq":["@activity","rest-and-relax"]}],"value":-4,"type":"untyped","enabled":true}]},"failure":{"msg":"<p>The rest is welcome, but not particularly beneficial in the long term.<\/p>","modifiers":[{"name":"Rest and Relax performed last turn","buttonLabel":"+4 DC increase if Rest and Relax performed next turn","turns":2,"applyIf":[{"eq":["@activity","rest-and-relax"]}],"value":-4,"type":"untyped","enabled":true}]},"criticalFailure":{"msg":"<p>The time is wasted, and when you get back to work, you have to spend extra time catching up. Take a –2 circumstance penalty to your next skill check made as a Leadership activity.<\/p>","modifiers":[{"turns":2,"name":"Rest and Relax: Critical Failure","buttonLabel":"-2 Circumstance to Next Leadership Skill Check","isConsumedAfterRoll":true,"applyIf":[{"eq":["@phase","leadership"]}],"enabled":true,"value":-2,"type":"circumstance"},{"name":"Rest and Relax performed last turn","buttonLabel":"+4 DC increase if Rest and Relax performed next turn","turns":2,"applyIf":[{"eq":["@activity","rest-and-relax"]}],"value":-4,"type":"untyped","enabled":true}]}},{"id":"restore-the-temple","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":25,"title":"Restore the Temple","description":"<p>You work with several worshippers of the temple's faith, gifted masons, and skilled laborers to restore the temple and once more consecrate it as a sacred place devoted to the worship of their god. @lose1d6ResourcePoints, then attempt a DC 25 Folklore check.<\/p>","skills":{"folklore":0},"criticalSuccess":{"msg":"<p>The temple is restored and can now serve as a Refuge terrain feature. If you later build a settlement here, the temple instead functions as a free Shrine in the settlement. In addition, your work was so excellent that you’ve attracted their god’s attention! The PC who rolled the Folklore check is granted @UUID[Compendium.pf2e.boons-and-curses.Item.hrTl9kfSNrOQeNze]: whenever that PC critically fails a check to Subsist in the wild, they gain a failure instead.<\/p>"},"success":{"msg":"<p>The temple is restored and can now serve as a Refuge terrain feature. If you later build a settlement here, the temple instead functions as a free Shrine in the settlement.<\/p>"},"failure":{"msg":"<p>Work proceeds but is not yet complete; you can attempt to restore the temple again on the next Kingdom turn.<\/p>"},"criticalFailure":{"msg":"<p>Disaster strikes as the temple’s cavern collapses and rubble spills out to bury and destroy much of the temple’s plaza. @gain1Decay and @gain1d4Unrest. You can still attempt to Restore the Temple, but the DC for success increases by 4. This increase is cumulative with successive critical failures.<\/p>","modifiers":[{"name":"Previously failed critically","buttonLabel":"+4 DC increase if previously failed critically","applyIf":[{"eq":["@activity","restore-the-temple"]}],"value":-4,"type":"untyped","enabled":true}]}},{"id":"send-diplomatic-envoy","oncePerRound":false,"fortune":false,"enabled":true,"phase":"leadership","dc":"negotiation","title":"Send Diplomatic Envoy","description":"<p>You send emissaries to another group to foster positive relations and communication. The DC of this check is the group’s Negotiation DC (see the sidebar on page 519). Attempts to Send a Diplomatic Envoy to a nation with which your kingdom is at war take a –4 circumstance penalty to the check and have the result worsened one degree. At the GM’s option, some wars might be so heated that this activity has no chance of success.<\/p>","automationNotes":"activities.send-diplomatic-envoy.automationNotes","skills":{"statecraft":1},"modifiers":[{"enabled":true,"name":"At War with Group","buttonLabel":"At War with Group","value":-4,"type":"circumstance","applyIf":[{"hasRollOption":"group-at-war"}],"downgradeResults":[{"downgrade":"criticalSuccess"},{"downgrade":"success"},{"downgrade":"failure"}]}],"criticalSuccess":{"msg":"<p>Your envoys are received quite warmly and make a good first impression. You establish diplomatic relations with the group (see page 534 for more information) and gain a +2 circumstance bonus to all checks made with that group until the next Kingdom turn.<\/p>","modifiers":[{"turns":1,"buttonLabel":"+2 Circumstance to Checks Made With Group","name":"Send Diplomatic Envoy: Critical Success","enabled":false,"value":2,"type":"circumstance"}]},"success":{"msg":"<p>You establish diplomatic relations.<\/p>"},"failure":{"msg":"<p>Your envoys are received, but the target organization isn’t ready to engage in diplomatic relations. If you attempt to Send a Diplomatic Envoy to the group next Kingdom turn, you gain a +2 circumstance bonus to that check.<\/p>","modifiers":[{"turns":2,"buttonLabel":"+2 Circumstance to Checks Made With Group","name":"Send Diplomatic Envoy: Failure","enabled":false,"value":2,"applyIf":[{"eq":["@activity","send-diplomatic-envoy"]}],"type":"circumstance"}]},"criticalFailure":{"msg":"<p>Disaster! Your envoy fails to reach their destination, is turned back at the border, or is taken prisoner or executed, at the GM’s discretion. The repercussions on your kingdom’s morale and reputation are significant. Choose one of the following results: @gain1d4Unrest, add 1 to a Ruin of your choice<\/p> <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul><p>or @lose2RolledResourceDice. In any event, you cannot attempt to Send a Diplomatic Envoy to this same target for the next 3 Kingdom Turns.<\/p>"}},{"id":"show-of-force","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Show of Force","description":"<p>Using your advice, a public show of force is performed in an attempt to curtail criminal activity or subversive activity in the kingdom. Attempt a basic Warfare check to determine how effective the Show of Force is.<\/p>","skills":{"warfare":0},"criticalSuccess":{"msg":"<p>The kingdom’s criminals are cowed by the show of force. @lose2Crime and reduce one other Ruin of your choice by 1<\/p> <ul><li>@lose1Corruption<\/li><li>@lose1Decay<\/li><li>@lose1Strife<\/li><\/ul>"},"success":{"msg":"<p>The kingdom’s criminals take note of the show of force. @lose1Crime<\/p>"},"failure":{"msg":"<p>The show of force fails to impress criminals but unsettles the rest of the citizens. @gain1Unrest.<\/p>"},"criticalFailure":{"msg":"<p>The criminals are emboldened by the failed show of force. @gain1d4Unrest and @gain1Crime.<\/p>"}},{"id":"spread-the-legend","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Spread the Legend","description":"<p>You work to spread the word of the party’s heroics and achievements, both through word of mouth and by distributing chapbooks or one-sheets detailing their exploits. Attempt a basic Arts check to determine the success of your efforts. If you have secured a printing press for the kingdom, the Arts check gains a +2 item bonus.<\/p>","skills":{"arts":0},"modifiers":[{"type":"item","buttonLabel":"Printing Press Secured","name":"Printing Press Secured","value":2,"enabled":false}],"criticalSuccess":{"msg":"<p>Not only do your stories bring pride and patriotism to the nation, but they also help increase its glory. @lose1d6Unrest, and @gain1FameNextTurn. In addition, if the kingdom experiences a dangerous random event during this turn’s Event Phase, reduce that event’s level modifier by 1.<\/p>","modifiers":[{"name":"Spread the Legend: Critical Success","buttonLabel":"Reduce Dangerous Event Modifier by 1","enabled":true,"value":1,"type":"untyped","applyIf":[{"in":["dangerous","@eventTraits"]}]}]},"success":{"msg":"<p>The rousing and inspiring stories you spread about the PCs helps to bring the nation together. @lose1d6Unrest<\/p>"},"failure":{"msg":"<p>You avoid spreading unfortunate news, but only just barely. The citizens are only slightly entertained by their leaders’ exploits. @lose1Unrest.<\/p>"},"criticalFailure":{"msg":"<p>You accidentally spreads news of a humiliating or embarrassing nature, causing the people of the kingdom to lose respect for their leaders. @gain1d4Unrest.<\/p>"}},{"id":"supernatural-solution","enabled":true,"phase":"leadership","dc":"control","title":"Supernatural Solution","description":"<p>Your spellcasters try to resolve issues when mundane solutions just aren’t enough. Attempt a basic check.<\/p>","automationNotes":"activities.supernatural-solution.automationNotes","oncePerRound":false,"fortune":true,"skills":{"magic":0},"criticalSuccess":{"msg":"<p>You can call upon your spellcasters’ supernatural solution to aid in resolving any Kingdom skill check made during the remainder of this Kingdom turn @gain1SupernaturalSolution. Do so just before a Kingdom skill check is rolled (by yourself or any other PC). Attempt a Magic check against the same DC in addition to the Kingdom skill check, and take whichever of the two results you prefer. If you don’t use your Supernatural Solution by the end of this Kingdom turn, this benefit ends and you gain 10XP instead.<\/p>"},"success":{"msg":"<p>You can call upon your spellcasters’ supernatural solution to aid in resolving any Kingdom skill check made during the remainder of this Kingdom turn @gain1SupernaturalSolution. Do so just before a Kingdom skill check is rolled (by yourself or any other PC). Attempt a Magic check against the same DC in addition to the Kingdom skill check, and take whichever of the two results you prefer. If you don’t use your Supernatural Solution by the end of this Kingdom turn, this benefit ends and you gain 10XP instead. However, you @lose1d4ResourcePoints to research the solution. This cost is paid now, whether or not you use your supernatural solution.<\/p>"},"failure":{"msg":"<p>Your attempt at researching a supernatural solution costs additional RP to research, but is ultimately a failure, providing no advantage. @lose2d6ResourcePoints<\/p>"},"criticalFailure":{"msg":"<p>Your attempt at researching a supernatural solution costs additional RP to research, but is ultimately a failure, providing no advantage. @lose2d6ResourcePoints. In addition, your spellcasters’ resources and morale are impacted such that you cannot attempt a Supernatural Solution again for 2 Kingdom turns.<\/p>"},"special":"You cannot influence a check with Supernatural Solution and Creative Solution simultaneously."},{"id":"supplementary-hunting","oncePerRound":false,"fortune":false,"enabled":false,"phase":"region","dc":"control","title":"Supplementary Hunting","description":"<p>Following your advice, rural-dwelling citizens work to supplement stores of food and resources through hunting and trapping. Attempt a basic Wilderness check to gather excess livestock from the local wildlife, ranches, and farms to generate food commodities.<\/p>","automationNotes":"activities.supplementary-hunting.automationNotes","skills":{"wilderness":0},"criticalSuccess":{"msg":"<p>@gain1d4Food, @gain1Luxuries, and @gain1ResourceDiceNextTurn<\/p>"},"success":{"msg":"<p>Choose one: @gain1d4Food, @gain1Luxuries, or @gain1ResourceDiceNextTurn<\/p>"},"failure":{"msg":"<p>Your hunters and trappers fail to supplement your stores and must spend time resupplying and setting new traps; you cannot attempt Supplementary Hunting on the next Kingdom turn.<\/p>"},"criticalFailure":{"msg":"Your hunters and trappers fail to supplement your stores and must spend time resupplying and setting new traps; you cannot attempt Supplementary Hunting on the next Kingdom turn. In addition, your hunters and trappers have accidentally attracted the attention of dangerous wildlife. Either @gain1d4Unrest or increase a Ruin of your choice by 1: <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>"}},{"id":"tap-treasury","order":3,"oncePerRound":false,"fortune":false,"enabled":true,"phase":"commerce","dc":"control","title":"Tap Treasury","description":"<p>You tap into the cash reserves of your kingdom for the PCs’ personal use or to provide emergency funding for an event. This is a basic check, but after you succeed or critically succeed at this activity, all future attempts to Tap Treasury have their results worsened two degrees. This penalty persists until funds equal to those taken from the treasury are repaid via Capital Investment<\/p>","skills":{"statecraft":0},"criticalSuccess":{"msg":"<p>You withdraw funds equal to the Currency per Additional PC column on Table 10–9: Party Treasure By Level @UUID[Compendium.pf2e.journals.JournalEntry.S55aqwWIzpQRFhcq.JournalEntryPage.Dae8LHdXZuBv06Jk]{Treasure}, or you successfully fund the unexpected event that required you to Tap your Treasury.<\/p>","modifiers":[{"name":"Tapped Treasury","buttonLabel":"Future Attempts Worsened By 2 Degrees Until Paid Back","applyIf":[{"eq":["@activity","tap-treasury"]}],"downgradeResults":[{"downgrade":"criticalSuccess","times":2},{"downgrade":"success","times":2},{"downgrade":"failure"}],"value":0,"type":"untyped","enabled":true}]},"success":{"msg":"<p>You withdraw funds equal to the Currency per Additional PC column on Table 10–9: Party Treasure By Level @UUID[Compendium.pf2e.journals.JournalEntry.S55aqwWIzpQRFhcq.JournalEntryPage.Dae8LHdXZuBv06Jk]{Treasure}, or you successfully fund the unexpected event that required you to Tap your Treasury. In addition, you overdraw your treasury in the attempt. You take a –1 circumstance penalty to all Economy-based checks until the end of your next Kingdom turn.<\/p>","modifiers":[{"value":-1,"buttonLabel":"-1 Circumstance to Economy","name":"Tap Treasury: Success","applyIf":[{"eq":["@ability","economy"]}],"turns":2,"enabled":true,"type":"circumstance"},{"name":"Tapped Treasury","buttonLabel":"Future Attempts Worsened By 2 Degrees Until Paid Back","applyIf":[{"eq":["@activity","tap-treasury"]}],"downgradeResults":[{"downgrade":"criticalSuccess","times":2},{"downgrade":"success","times":2},{"downgrade":"failure"}],"value":0,"type":"untyped","enabled":true}]},"failure":{"msg":"<p>You fail to secure the funds you need, and rumors about the kingdom’s potential shortfall of cash cause you to take a –1 circumstance penalty to all Loyalty- and Economy-based checks until the end of your next Kingdom turn.<\/p>","modifiers":[{"value":-1,"buttonLabel":"-1 Circumstance to Economy and Loyalty","name":"Tap Treasury: Failure","applyIf":[{"in":["@ability",["loyalty","economy"]]}],"turns":2,"enabled":true,"type":"circumstance"},{"name":"Tapped Treasury","buttonLabel":"Future Attempts Worsened By 2 Degrees Until Paid Back","applyIf":[{"eq":["@activity","tap-treasury"]}],"downgradeResults":[{"downgrade":"criticalSuccess","times":2},{"downgrade":"success","times":2},{"downgrade":"failure"}],"value":0,"type":"untyped","enabled":true}]},"criticalFailure":{"msg":"You fail to secure the funds you need, and rumors about the kingdom’s potential shortfall of cash cause you to take a –1 circumstance penalty to all Loyalty- and Economy-based checks until the end of your next Kingdom turn. In addition, rumors spiral out of control. @gain1Unrest and add 1 to a Ruin of your choice: <ul><li>@gain1Corruption<\/li><li>@gain1Crime<\/li><li>@gain1Decay<\/li><li>@gain1Strife<\/li><\/ul>","modifiers":[{"value":-1,"buttonLabel":"-1 Circumstance to Economy and Loyalty","name":"Tap Treasury: Critical Failure","applyIf":[{"in":["@ability",["loyalty","economy"]]}],"turns":2,"enabled":true,"type":"circumstance"},{"name":"Tapped Treasury","buttonLabel":"Future Attempts Worsened By 2 Degrees Until Paid Back","applyIf":[{"eq":["@activity","tap-treasury"]}],"downgradeResults":[{"downgrade":"criticalSuccess","times":2},{"downgrade":"success","times":2},{"downgrade":"failure"}],"value":0,"type":"untyped","enabled":true}]}},{"id":"trade-commodities","order":4,"oncePerRound":false,"fortune":false,"enabled":true,"phase":"commerce","dc":"control","title":"Trade Commodities","description":"<p>There are five different categories of Commodities: Food, Lumber, Luxuries, Ore, and Stone. When you Trade Commodities, select one Commodity that your kingdom currently stockpiles and reduce that Commodity’s stockpile by up to 4. Then attempt a basic check. If you trade with a group that you’ve established diplomatic relations with, you gain a +1 circumstance bonus to the check.<\/p>","modifiers":[{"type":"circumstance","value":1,"enabled":false,"name":"Trading with a group with established diplomatic relationships","buttonLabel":"+1 Circumstance to trade with a group with established diplomatic relationships"}],"skills":{"industry":0},"criticalSuccess":{"msg":"<p>@gainMultiple2ResourceDiceNextTurn per point of stockpile expended from your Commodity now.<\/p>"},"success":{"msg":"<p>@gainMultiple1ResourceDiceNextTurn per point of stockpile expended from your Commodity now.<\/p>"},"failure":{"msg":"<p>@gain1ResourceDiceNextTurn<\/p>"},"criticalFailure":{"msg":"<p>You gain no bonus Resource Dice (though the Commodity remains depleted). If you Traded Commodities the previous turn, @gain1Unrest<\/p>"}},{"id":"train-army","oncePerRound":false,"fortune":false,"enabled":true,"phase":"army","dc":"control","title":"Train Army","description":"<p>You train an army in the use of a tactic. Choose one of the tactics from those listed starting on page 68, then attempt a Scholarship or Warfare check against the tactic’s Training DC. If your army has already learned its maximum number of tactics, the newly learned tactic replaces a previously learned tactic of your choice. <\/p>","defaultToBestSkill":true,"skills":{"scholarship":0,"warfare":0},"criticalSuccess":{"msg":"<p>The army learns the tactic and then becomes efficient.<\/p>"},"success":{"msg":"<p>The army learns the tactic.<\/p>"},"failure":{"msg":"<p>The army fails to learn the tactic.<\/p>"},"criticalFailure":{"msg":"<p>The army not only fails to learn the tactic but becomes frustrated and exhausted from the training; increase the army’s weary condition by 1.<\/p>"}},{"id":"warfare-exercises","oncePerRound":false,"fortune":false,"enabled":false,"phase":"leadership","dc":"control","title":"Warfare Exercises","description":"<p>You spend time studying the nation’s armies, speaking with its commanders, researching historical records of battles, and running simulations in war rooms to help predict the best ways to prepare for upcoming conflicts. Attempt a basic Warfare check to determine the success of these exercises.<\/p>","skills":{"warfare":0},"criticalSuccess":{"msg":"<p>The exercises reveal a wide range of suggestions for the PCs to use during that month’s military exercises. All Army activities taken during this Kingdom turn’s Activity Phase gain a +1 circumstance bonus. This bonus increases to +2 at Kingdom level 9 and +3 at Kingdom level 15. In addition, the next time this Kingdom turn that you roll a critical failure on an Army activity, the result is improved to a regular failure instead.<\/p>","modifiers":[{"turns":1,"enabled":true,"buttonLabel":"+1/+2/+3 Circumstance to Army Activities","name":"Warfare Exercises","applyIf":[{"eq":["@phase","army"]}],"value":0,"valueExpression":{"when":{"cases":[{"case":[{"all":[{"gte":["@kingdomLevel",9]},{"lt":["@kingdomLevel",15]}]},2]},{"case":[{"gte":["@kingdomLevel",15]},3]}],"default":1}},"type":"circumstance"},{"turns":1,"enabled":true,"buttonLabel":"Prevent Critical Failure on Army Activity Once","name":"Prevent Critical Failure on Army Activity Once","isConsumedAfterRoll":true,"applyIf":[{"eq":["@phase","army"]}],"value":0,"upgradeResults":[{"upgrade":"criticalFailure"}],"type":"untyped"}]},"success":{"msg":"<p>The exercises grant a +1 circumstance bonus to your first Army activity taken during the Kingdom turn’s Activity Phase. This bonus increases to +2 at Kingdom level 9 and +3 at Kingdom level 15.<\/p>","modifiers":[{"turns":1,"isConsumedAfterRoll":true,"enabled":true,"buttonLabel":"+1/+2/+3 Circumstance to Army Activities","name":"Warfare Exercises","applyIf":[{"eq":["@phase","army"]}],"value":0,"valueExpression":{"when":{"cases":[{"case":[{"all":[{"gte":["@kingdomLevel",9]},{"lt":["@kingdomLevel",15]}]},2]},{"case":[{"gte":["@kingdomLevel",15]},3]}],"default":1}},"type":"circumstance"}]},"failure":{"msg":"<p>The warfare exercises provide no insight this turn.<\/p>"},"criticalFailure":{"msg":"<p>You accidentally form incorrect assumptions about your military tactics. The next time you roll a failure on an Army a ffectsDowntime":false,"reducesUnrest":true,"reduceUnrestBy":{"value":"1","moreThanOncePerTurn":true,"note":"as long as it's the first wall in a settlement"},"level":1,"construction":{"rp":2,"lumber":4,"skills":[{"skill":"defense"}],"dc":15}},{"id":"watchtower-stone","name":"Watchtower, Stone","stacksWith":"watchtower","settlementEventRules":[{"value":1}],"traits":["building"],"affectsDowntime":false,"reducesUnrest":true,"reduceUnrestBy":{"value":"1"},"level":3,"construction":{"rp":12,"stone":4,"skills":[{"skill":"defense","proficiencyRank":1}],"dc":18},"lots":1},{"id":"watchtower","name":"Watchtower","settlementEventRules":[{"value":1}],"traits":["building"],"affectsDowntime":false,"reducesUnrest":true,"reduceUnrestBy":{"value":"1"},"level":3,"construction":{"rp":12,"lumber":4,"skills":[{"skill":"defense","proficiencyRank":1}],"dc":18},"lots":1},{"id":"waterfront","name":"Waterfront","activityBonusRules":[{"value":1,"activity":"go-fishing"},{"value":1,"activity":"establish-trade-agreement"}],"availableItemsRules":[{"value":1,"maximumStacks":1,"alwaysStacks":true}],"traits":["yard"],"affectsDowntime":false,"reducesUnrest":false,"level":8,"upgradeFrom":["pier","pier-vk"],"construction":{"rp":90,"lumber":10,"skills":[{"skill":"boating","proficiencyRank":2}],"dc":24},"lots":4}],"feats":[{"id":"civil-service","removeLeaderVacancyPenalty":true,"name":"Civil Service","level":1,"text":"Everyone has a place and a role, and as long as those roles are filled, the government functions. When you select this feat, choose one leadership role; that role is now supported by your efficient civil servants, so its vacancy penalty is no longer applicable. If you wish to change the leadership role to which Civil Service applies, you can do so using the New Leadership activity at the start of a Kingdom turn. You gain a +2 circumstance bonus to New Leadership checks.","modifiers":[{"name":"Civil Service","buttonLabel":"+2 Circumstance to New Leadership","enabled":true,"value":2,"type":"circumstance","applyIf":[{"in":["@activity",["new-leadership","new-leadership-vk"]]}]}]},{"id":"cooperative-leadership","name":"Cooperative Leadership","level":1,"text":"Your leaders are skilled at working with one another. When a leader uses the Focused Attention kingdom activity to aid another leader’s kingdom check, the circumstance bonus granted by a success is increased to +3. At 11th level, your leaders’ collaborative style leads them to ever greater successes when they work together. When a leader uses the Focused Attention kingdom activity to aid another leader’s check, treat a critical failure on the aided check as a failure. If your kingdom has at least the expert rank in the skill used in the aided check, treat a failure on the check as a success. (This does not allow you to ever improve a critical failure to a success.)","rollOptions":["cooperative-leadership"],"modifiers":[{"name":"Cooperative Leadership: Upgrade Critical Failures","buttonLabel":"Cooperative Leadership","type":"untyped","value":0,"enabled":true,"upgradeResults":[{"upgrade":"criticalFailure"}],"applyIf":[{"hasRollOption":"focused-attention"},{"gte":["@kingdomLevel",11]}]},{"name":"Cooperative Leadership: Upgrade Failures","buttonLabel":"Cooperative Leadership","type":"untyped","value":0,"enabled":true,"upgradeResults":[{"upgrade":"failure"}],"applyIf":[{"hasRollOption":"focused-attention"},{"gte":["@kingdomLevel",11]},{"gte":["@skillRank",2]}]}]},{"id":"crush-dissent","name":"Crush Dissent","level":1,"requirements":{"skillRanks":{"warfare":1}},"text":"Your rule brooks no dissent and stamps out traitors, making harsh examples of them. Once per Kingdom turn when you gain Unrest, you can attempt to crush the dissent by attempting a basic Warfare check. On a success, the Unrest increase is canceled, but on a critical failure, the Unrest increase is doubled. In addition, you gain a +1 circumstance bonus to checks to resolve dangerous kingdom events that involve internal bickering, such as Feud.","modifiers":[{"name":"Dangerous Kingdom Event involving internal bickering","buttonLabel":"+1 Circumstance to Dangerous Bickering Event","enabled":false,"value":1,"type":"circumstance","applyIf":[{"in":["dangerous","@eventTraits"]}]}]},{"id":"endure-anarchy","name":"Endure Anarchy","level":3,"requirements":{"abilityScores":{"loyalty":14}},"increaseAnarchyLimit":4,"increaseActivityUnrestReductionBy":{"value":1,"minimumCurrentUnrest":6},"text":"Your kingdom holds together even in the midst of extreme peril. If your kingdom’s Unrest is 6 or higher and you use a kingdom activity that decreases Unrest, decrease the Unrest by an additional 1. You do not fall into anarchy unless your kingdom’s Unrest reaches 24"},{"id":"fame-and-fortune","name":"Fame and Fortune","level":11,"text":"Your kingdom’s reputation has spread far and wide, bringing in visitors to behold the spectacle of your greatness and pay their respects. Whenever you achieve a critical success on any Kingdom skill check during the Activity phase of a Kingdom turn, gain 1 bonus Resource Die at the start of your next Kingdom turn.","modifiers":[{"type":"untyped","name":"Fame & Fortune","buttonLabel":"Gain additional RD on a Critical Success","applyIf":[{"in":["@phase",["leadership","army","region","civic"]]}],"value":0,"enabled":true,"notes":[{"degree":"criticalSuccess","note":"@gain1ResourceDiceNextTurn"}]}]},{"id":"fortified-fiefs","name":"Fortified Fiefs","level":1,"requirements":{"skillRanks":{"defense":1}},"text":"Your vassals take their duty to protect those under their stewardship seriously, and your engineers emphasize the value of a strong defense when it comes to building settlements and fortifications. You gain a +2 circumstance bonus to checks attempted as part of the Fortify Hex activity and on activities to build or repair a Barracks, Castle, Garrison, Keep, Stone Wall, or Wooden Wall. In addition, you gain a +1 circumstance bonus to all kingdom checks attempted during dangerous events that directly impact your settlements’ defenses.","modifiers":[{"name":"Fortified Fiefs","buttonLabel":"+2 Circumstance to Fortify Hex or Build/Repair Barracks, Castle, Garrison, Keep, Stone Wall, or Wooden Wall","type":"circumstance","applyIf":[{"some":[{"in":["@activity",["fortify-hex","fortify-hex-vk"]]},{"in":["@structure",["barracks","castle","castle-vk","garrison","garrison-vk","keep","keep-vk","wall-stone","wall-wooden"]]}]}],"enabled":true,"value":2},{"name":"Dangerous Event Impacting Settlement Defenses","buttonLabel":"+1 Circumstance to Dangerous Event Impacting Defenses","type":"circumstance","applyIf":[{"in":["settlement","@eventTraits"]},{"in":["dangerous","@eventTraits"]}],"enabled":false,"value":1}]},{"id":"free-and-fair","name":"Free and Fair","level":7,"text":"Your reputation for transparency and fairness in conducting elections, appointments, and other changes in government inspires tremendous public trust. You gain a +2 circumstance bonus to Loyalty-based checks attempted as part of the New Leadership and Pledge of Fealty activities. If you fail or critically fail such a check, you can spend 2 RP to reroll the check (but without the +2 circumstance bonus); attempting this adds the Fortune trait. You must take the result of the second roll, even if it is worse than the original roll.","modifiers":[{"name":"Free & Fair","buttonLabel":"+2 Circumstance to Loyalty During New Leadership/Pledge of Fealty","type":"circumstance","applyIf":[{"eq":["@ability","loyalty"]},{"in":["@activity",["new-leadership","new-leadership-vk","pledge-of-fealty"]]},{"not":{"hasRollOption":"free-and-fair"}}],"enabled":true,"value":2}],"isFreeAndFair":true},{"id":"insider-trading","name":"Insider Trading","level":1,"requirements":{"skillRanks":{"industry":1}},"text":"Your leading citizens share valuable business information with one another and with associates in other lands, and they hire one another’s workers to supply the labor they need to fuel their production. You gain a +1 circumstance bonus to Establish Work Site, Establish Trade Agreement, and Trade Commodities activities. In addition, gain 1 bonus Resource Die at the start of each Kingdom turn.","modifiers":[{"name":"Insider Trading","buttonLabel":"+1 Circumstance to Establish Worksite, Establish Trade Agreement and Trade Commodities","type":"circumstance","applyIf":[{"in":["@activity",["establish-work-site-quarry","establish-work-site-lumber","establish-work-site-mine","establish-trade-agreement","trade-commodities"]]}],"enabled":true,"value":1}],"resourceDice":1},{"id":"inspiring-entertainment","name":"Inspiring Entertainment","level":3,"requirements":{"abilityScores":{"culture":14}},"text":"Your kingdom’s artists and entertainers are talented and prolific, and there’s never a shortage of new plays, operas, novels, music, sculptures, paintings, or other forms of distraction to entertain the citizens, even during times of upheaval. Your kingdom gains a +2 circumstance bonus to all Culture-based skill checks whenever your kingdom has at least 1 Unrest.","modifiers":[{"name":"Inspiring Entertainment","buttonLabel":"+2 Circumstance to Culture When Unrest","type":"circumstance","enabled":true,"value":2,"applyIf":[{"gte":["@unrest","1"]},{"eq":["@ability","culture"]}]}]},{"id":"kingdom-assurance-agriculture","name":"Kingdom Assurance (Agriculture)","level":1,"text":"Even when things go poorly in other areas, you can count on consistency in carrying out kingdom activities with a chosen skill. Choose one Kingdom skill in which your kingdom is trained. Once per Kingdom turn, when you would attempt a skill check for that skill, you can forgo rolling and instead take a result equal to 10 + your proficiency bonus; do not apply any other bonuses, penalties, or modifiers to this result. Special You can select this feat multiple times. Each time, choose a different skill and gain the benefits of this feat for that skill.","assuranceForSkill":"agriculture"},{"id":"kingdom-assurance-arts","name":"Kingdo
